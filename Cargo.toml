[workspace]
resolver = "2"
members = ["crates/*", "python/client", "node", "node/client", "node/unity-catalog-client"]
# This is the NATIVE workspace. The in-browser query engine lives in its OWN
# standalone workspace under `wasm/` (`wasm/query-wasm` + `wasm/olai-delta-df`),
# NOT here — see `wasm/Cargo.toml` and #182. The wasm workspace owns the
# wasm-specific fork stack (the arrow-rs / object_store patch); this native
# workspace resolves arrow, parquet and object_store straight from crates.io. The
# two workspaces have independent `Cargo.lock`s. `wasm/query-wasm` reaches back
# into this workspace's crates via cross-workspace `path = "../../crates/*"` deps.

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/mangrove"
readme = "README.md"
# Floor set by the dependency tree: deltalake-core 2.0 (delta-rs main) requires
# rustc 1.95.0 (buoyant_kernel 0.28 needs 1.88). Keep CI's toolchain pin >= this.
rust-version = "1.95.0"
# Crates are versioned independently in each crate's own `[package].version`
# (the release-plz convention), so there is intentionally no workspace-wide
# `version` here.
homepage = "https://unitycatalog.io"
keywords = [
  "unitycatalog",
  "deltalake",
  "lakehouse",
  "delta-sharing",
  "governance",
]

[workspace.dependencies]
# The Delta stack: the published `buoyant_kernel` (the Buoyant Data distribution of
# delta-kernel-rs) plus delta-rs. `deltalake-core` 1.1 depends on `buoyant_kernel`
# from crates.io, so depending on the same published crate here makes the kernel
# `Snapshot` / `Engine` / `Committer` types unify between our crates and delta-rs.
# The `package` aliases keep every `delta_kernel::` / `delta_kernel_default_engine::`
# path unchanged. `default-features = false` + an explicit `arrow-59` keeps the
# kernel on the same arrow major as datafusion 55 / deltalake-core 1.1.
delta_kernel = { package = "buoyant_kernel", version = "0.28.1", default-features = false, features = [
  "internal-api",
  "default-engine-base",
  "arrow-59",
] }
delta_kernel_default_engine = { package = "buoyant_kernel_engine", version = "0.28.0", default-features = false, features = [
  "arrow-59",
  "rustls",
] }
# deltalake-core is the ONE remaining git dep: the roeap fork's
# `olai/catalog-managed` branch = upstream delta-rs `main` @807b9c03 (2.0.0-dev,
# which has the catalog-managed read path: `Snapshot::try_new_with_engine_and_catalog`
# + `CatalogManaged` / `VacuumProtocolCheck` reader support, delta-rs#4809) plus
# one commit making `to_delta_predicate` public. Switch to the crates.io release once
# 2.0 ships with that export. Pinned by immutable `rev`. `version =` matches the
# fork (release-plz#2595); 2.0.0 is not on crates.io yet, which is fine while
# every dependent (datafusion, acceptance, py client) is
# `release = false`.
deltalake-core = { version = "2.0.0", git = "https://github.com/roeap/delta-rs", rev = "4b2af2d34409649ccf762312160405acdeaafea0", features = [
  "datafusion",
  "cloud",
] }

aes-gcm = { version = "0.10" }
async-trait = "0.1.83"
axum = { version = "0.8" }
axum-extra = { version = "0.10", features = ["query"] }
bytes = { version = "1.1" }
chrono = { version = "0.4.41", features = ["serde"] }
dashmap = { version = "6" }
datafusion = { version = "55" }
env_logger = "0.11"
futures = "0.3.32"
itertools = { version = "0.14.0" }
napi = { version = "3.5", default-features = false, features = [
  "napi9",
  "async",
  "web_stream",
] }
napi-derive = "3.5"
# buffa proto runtime consumed by the generated models (replaces the prost +
# prost-serde + tonic-prost model stack). Version tracks the
# `buf.build/anthropics/buffa:v0.7.0` plugin pinned in buf.gen.yaml. NOTE: the
# snake_case JSON wire-compat (see `json_field_names: proto` in trestle.yaml) is
# a trestle post-emit rewrite of buffa's `#[serde(rename = "camelCase", ...)]` /
# `serialize_entry("camelCase", ...)` output — a buffa release that changes that
# emission shape would silently reintroduce camelCase, so keep this version and
# the plugin version in lockstep and re-verify the wire fixtures on any bump.
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
# ConnectRPC runtime backing the generated `portal.files.v1` FilesService trait +
# dispatcher (crates/files-proto) and the native Files API server
# (crates/files-api). Version tracks the `buf.build/anthropics/connect-rust:v0.7.0`
# plugin in buf.gen.files.yaml. default-features = false here so files-proto stays
# lean (trait/dispatcher/client only); files-api's `server` feature opts back into
# the `server`/`axum` features it needs.
connectrpc = { version = "0.7", default-features = false }
http-body = { version = "1" }
object_store = { version = "0.13.2", features = ["azure", "aws", "gcp"] }
olai-credential-vending = { version = "0.0.2" }
olai-http = { version = "0.0.9" }
olai-http-wasm = { version = "0.0.5" }
olai-storage-credentials = { version = "0.0.1" }
olai-store = { version = "0.0.6" }
olai-vended-store = { version = "0.0.1", default-features = false }
pbjson = { version = "0.9" }
pbjson-types = "0.9"
prost = { version = "0.14.1" }
prost-types = { version = "0.14.1" }
pyo3 = { version = "0.30", features = ["macros", "indexmap"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yml = { version = "0.0.12" }
# Bridges a `!Send` future so it satisfies a `Send` trait bound; used on wasm to
# adapt the browser Fetch credential future onto object_store's `CredentialProvider`.
send_wrapper = { version = "0.6", features = ["futures"] }
strum = { version = "0.27", features = ["derive"] }
sqlx = { version = "0.8.3" }
# Standalone SQL parser. DataFusion only re-exports this crate, so we depend on it
# directly for metric-view dependency extraction. Keep the version aligned with the
# one DataFusion (`datafusion` above) resolves so the AST types unify across crates.
sqlparser = { version = "0.62.0" }
thiserror = { version = "2" }
tokio = { version = "1.40" }
tonic = { version = "0.14" }
tonic-prost = { version = "0.14" }
tower = { version = "0.5", features = ["limit", "filter", "util"] }
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
  "serde",
  "std",
], default-features = false }
uuid = { version = "1", features = ["serde"] }
# Non-panicking `Instant`/`SystemTime` on `wasm32-unknown-unknown` (std's panics).
web-time = { version = "1" }
zeroize = { version = "1.8", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "json",
  "stream",
] }

# Local dev/test builds: line tables for workspace crates, so panics and
# backtraces keep file:line, and no debug info for dependencies, which is most of
# target/. Many parallel worktrees each carry a target/, so this matters on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for a debugger: `cargo build --profile debugging`
# (builds into target/debugging/, separate from the dev artifacts).
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[workspace.metadata.typos]
default.extend-ignore-re = [
  # Custom ignore regex patterns: https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
  "(?s)//\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*",
  # Line block with # spellchecker:<on|off>
  "(?s)(#|//|<\\!--)\\s*spellchecker:off.*?\\n\\s*(#|//|<\\!--)\\s*spellchecker:on",
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
]
files.extend-exclude = [
  "crates/common/src/models/_gen/**/*",
  # buffa + connect-rust output for the portal.files.v1 FilesService contract
  # (`@generated`, never hand-edited) — the connect dispatcher/view aliases carry
  # random-looking substrings the spellchecker flags.
  "crates/files-proto/src/generated/**/*",
  "openapi/**/*",
  "node/client/unitycatalog/codegen/models/gen/**/*",
  # protoc-gen-es output (`@generated`, never hand-edited): the base64 `fileDesc`
  # descriptor blob contains random substrings the spellchecker flags as typos
  # (MKE/GES/Muc/…). Excludes the query + files-connect connect-es gen dirs.
  "node/*/src/gen/**/*",
  "../trestle/crates/trestle-codegen/src/gen/**/*",
]

[workspace.metadata.typos.default.extend-words]
# to avoid having to name fields r#type
typ = "typ"
AKS = "AKS"
