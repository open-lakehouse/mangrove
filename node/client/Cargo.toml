# The NAPI extension behind the npm package @open-lakehouse/unity-catalog-node.
#
# It is never published to crates.io (`publish = false`, `git_only` in
# release-plz.toml), but release-plz versions it like any other crate: the
# `version` below IS the npm package's version. release-plz bumps it from
# conventional commits, writes CHANGELOG.md and tags
# `unity-catalog-node-v<version>`; release-plz.yml then hands the release to
# js-release.yaml, which stamps the version into package.json, builds the
# per-target binaries and publishes to GitHub Packages. package.json stays at
# 0.0.0 in git.
#
# release-plz decides a crate changed from the files `cargo package --list`
# reports, so `include` lists exactly what feeds the npm package: the Rust
# binding, the TypeScript wrapper + generated models, and the npm manifests.
# Tests and tooling config are left out so they don't cut releases. Changes to
# the wrapped Rust crates (olai-uc-client / olai-uc-common) release this
# package through the path dependencies.

[package]
name = "unity-catalog-node"
version = "0.0.4"
description = "NAPI extension for the @open-lakehouse/unity-catalog-node npm package"
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
include = [
  "/Cargo.toml",
  "/build.rs",
  "/src/**",
  "/unitycatalog/**",
  "/package.json",
  "/npm/*/package.json",
  "/README.md",
  "/tsconfig.json",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
unitycatalog-client = { package = "olai-uc-client", path = "../../crates/client", version = "0.0.8" }
unitycatalog-common = { package = "olai-uc-common", path = "../../crates/common", version = "0.0.8", features = ["node"] }

# Generated bindings encode models across the napi boundary via `buffa::Message`.
buffa = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
olai-http = { workspace = true }
prost = { workspace = true }
url = { workspace = true }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
strip = "symbols"
