# A placeholder crate that ties the bundled web UI (node/app and the
# @open-lakehouse/* workspace packages it imports) to the olai-uc-server release.
# The server's Docker image bakes in the SPA built from node/, but release-plz
# only understands Cargo packages and decides a package has changed from the
# files `cargo package --list` reports, so a node/ change never touched the
# server crate on its own.
#
# This manifest sits at node/ so its package fileset is every git-tracked file
# under node/ (Cargo drops the nested packages node/client and
# node/unity-catalog-client automatically). Any UI change therefore releases
# this crate, and the server's `changelog_include = ["uc-app", ...]` in
# release-plz.toml makes that release the server too (at most a patch bump),
# whose tag drives the Docker build. This replaces the old
# crates/server/ui.lock fingerprint.
#
# It is never published to crates.io (`publish = false`, and `git_only` in
# release-plz.toml). release-plz bumps its version, writes CHANGELOG.md, and
# tags `uc-app-v<version>`; nothing is published for it.

[package]
name = "uc-app"
version = "0.0.1"
description = "Release placeholder for the Unity Catalog web UI bundled into the server image"
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
# Stories and tests never reach the bundle.
exclude = ["**/*.stories.tsx", "**/*.test.ts", "**/*.test.tsx"]

[lib]
path = "release.rs"
