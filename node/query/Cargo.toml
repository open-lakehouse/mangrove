# A placeholder crate that lets release-plz version and release the npm package
# @open-lakehouse/query alongside the Rust crates, like ../unity-catalog-client
# (see the comment there). `include` lists exactly the sources that end up in
# the npm tarball (tests and stories excluded). It is never published to
# crates.io; its `version` is the npm package's version, and package.json
# stays at 0.0.0 in git.

[package]
name = "query"
version = "0.0.1"
description = "Release placeholder for the @open-lakehouse/query npm package"
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
include = [
  "/Cargo.toml",
  "/release.rs",
  "/package.json",
  "/README.md",
  "/DESIGN.md",
  "/tsconfig.json",
  "/tsconfig.build.json",
  "/src/**",
  "!/src/**/*.test.ts",
  "!/src/**/*.test.tsx",
  "!/src/**/*.stories.tsx",
]

[lib]
path = "release.rs"
