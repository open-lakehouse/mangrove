name: js-changeset-autogen

# The "automatic" half of the JS release pipeline (the counterpart to release-plz
# reading commits for the Rust crates). On every push to `main`, derive Changesets
# entries from the conventional commits that touched `node/**` since the last JS
# release tag and commit them. They accumulate in `.changeset/` until the
# `js-release` workflow opens a "Version Packages" PR.
#
# Contributors normally do NOT hand-write changesets; a hand-written one still
# wins (see .agents/rules/js-release-changesets-rule.mdc). The generator is
# idempotent per commit sha, so re-runs on the same tip do not pile up duplicates.

on:
  push:
    branches:
      - main
    paths:
      - "node/**"

# Least privilege: grant per job, nothing at the top level.
permissions: {}

# Serialize with itself so two quick pushes don't both push a changeset commit
# and race. Do not cancel — a superseded run may have already committed.
concurrency:
  group: js-changeset-autogen
  cancel-in-progress: false

jobs:
  autogen:
    name: Generate changesets from commits
    if: ${{ github.repository == 'open-lakehouse/mangrove' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit generated .changeset/*.md back to main
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need history + tags to diff since the last release
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate changeset from node/ commits
        run: bun run scripts/autogen-changeset.ts

      - name: Commit generated changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .changeset; then
            echo "No new changesets generated — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset
          git commit -m "chore(release): autogenerate changesets from commits [skip ci]"
          git push
