name: Release Python wheels

# Build the `unitycatalog-client` maturin wheels for each supported platform and
# attach them (+ SLSA build-provenance attestations) to a GitHub Release for the
# pushed `unitycatalog-client-py-v*` tag. This makes the prebuilt wheels
# installable straight off the release (`uv pip install <release-asset-url>` /
# `gh release download`) without a PyPI account.
#
# The `unitycatalog-client-py` crate is `release = false` in release-plz.toml —
# release-plz does NOT tag or release it (a `cargo package` diff on it walks the
# workspace path-dep graph into `olai-uc-datafusion`'s git deps, which have no
# registry version and `cargo package` rejects). So this crate's release is
# MANUAL: push a `unitycatalog-client-py-v<version>` tag and this workflow fires,
# creates the GitHub Release if absent, builds the wheels, and attaches them.
#
# abi3: `pyo3/abi3-py39` (python/client/Cargo.toml) means ONE wheel per platform
# covers every CPython >= 3.9 — the matrix is platform-only, no per-Python fan-out.
#
# sdist is intentionally NOT built: `maturin sdist` cannot package this crate's
# workspace path-dependencies (`olai-uc-client` / `olai-uc-common` pull the
# repo-root README into the sdist and collide). Wheels are the shipped artifact.
#
# Triggers:
#   - push of a `unitycatalog-client-py-v*` tag (the normal release path).
#   - workflow_dispatch against an existing such tag (manual rebuild, e.g. a
#     toolchain refresh) — takes the tag as an input.

on:
  push:
    tags:
      - "unitycatalog-client-py-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing unitycatalog-client-py-v* tag to build + attach wheels to."
        required: true
        type: string

# Least privilege: nothing at the top level.
permissions: {}

# Key concurrency off the tag (from the push ref or the dispatch input). Do NOT
# cancel in progress — a superseded run may have partially uploaded assets, and
# cancelling mid-upload would leave the release with a subset of platform wheels.
concurrency:
  group: python-wheels-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Ensure a GitHub Release exists for the tag before the matrix uploads to it.
  # A tag push does not create a Release, and release-plz does not manage this
  # crate, so we create one here (idempotent: skipped if it already exists, e.g.
  # a workflow_dispatch rebuild).
  release:
    name: Ensure release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'open-lakehouse/mangrove' }}
    permissions:
      contents: write # create the GitHub Release for the tag
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag + version
        id: resolve
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            unitycatalog-client-py-v*) ;;
            *) echo "::error::unexpected tag '$TAG' (want unitycatalog-client-py-v*)"; exit 1 ;;
          esac
          version="${TAG#unitycatalog-client-py-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it in place."
          else
            gh release create "$TAG" \
              --title "unitycatalog-client v${VERSION}" \
              --notes "Python wheels for \`unitycatalog-client\` ${VERSION}. Install with \`uv pip install\` against an asset URL below."
          fi

  # Build one abi3 wheel per platform on its native/appropriate runner (no QEMU),
  # upload it to the GitHub Release, and attest its build provenance.
  wheels:
    name: ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # Protected environment mirrors the release-plz job boundary. No secrets are
    # consumed here (attestations use OIDC), but keeping the boundary consistent
    # guards future signing credentials.
    environment: release
    permissions:
      contents: write # attach wheel assets to the GitHub Release
      id-token: write # OIDC for build-provenance attestation
      attestations: write # write the attestation to the attestations store

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm # native arm64 hosted runner
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel macOS: cross-compiled from the arm64 macos-latest runner
          # (GitHub's Intel macOS runners are deprecated). Building both Darwin
          # targets on the same runner keeps the matrix on supported hardware.
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build the exact commit the release tag points at, not the branch tip.
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          # Matches the rest of CI; stays above the workspace floor.
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      # Build a release abi3 wheel for this target into dist/. maturin-action
      # provides the manylinux container + toolchain for the Linux legs; the
      # `manylinux` input is a no-op on the macOS legs. `--frozen` builds against
      # the committed Cargo.lock for reproducibility (implies --locked). One wheel
      # per platform (abi3), so no interpreter list.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2_28"
          sccache: "true"
          args: --release --frozen --out dist --manifest-path python/client/Cargo.toml

      # Attach the wheel(s) to the release. `--clobber` makes re-runs (a
      # workflow_dispatch rebuild) idempotent. GH_REPO lets `gh` resolve the repo
      # without relying on git remote inference.
      - name: Upload wheel to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.whl --clobber

      # Key-free SLSA build provenance over the built wheel(s), verifiable with
      # `gh attestation verify <wheel> --repo open-lakehouse/mangrove`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.whl
