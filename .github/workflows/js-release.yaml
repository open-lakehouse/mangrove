name: js-release

# Publishes the npm packages to GitHub Packages (npm.pkg.github.com) and
# npmjs.com, and attaches each tarball to its GitHub Release.
#
# release-plz owns versioning: each npm package is a crate in release-plz.toml
# (`unity-catalog-node` = the NAPI extension in node/client; every pure-TS
# package = a placeholder crate next to its package.json). release-plz bumps the
# crate version from conventional commits, writes the CHANGELOG, tags
# `<crate>-v<version>` and creates the GitHub Release. release-plz.yml then calls
# this workflow with the npm packages it released this run. package.json
# versions stay 0.0.0 in git; the released version is stamped in here.
#
# `pack` builds every released package (and, for the NAPI extension, each
# target binary and its per-platform package) and packs the tarballs once.
# Three jobs then ship those exact tarballs, each with only the permissions it
# needs: `github-packages`, `npmjs` (staged trusted publishing, gated on the
# NPMJS_PUBLISH_ENABLED repo variable) and `github-release` (provenance
# attestation + release assets). Publishing skips versions a registry already
# has, so re-runs are safe. No package.json sets publishConfig.registry: the
# registry is each job's choice.
#
# Kill switch: nothing is built or published unless the `JS_PUBLISH_ENABLED`
# repo variable is "true". A release cut while it was off (or a failed publish)
# can be published later with workflow_dispatch and the release tag.

on:
  workflow_call:
    inputs:
      releases:
        description: >-
          JSON array of the npm-package crates release-plz released, as in its
          `releases` output: [{"package_name": "...", "version": "...", "tag": "..."}].
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. unity-catalog-node-v0.2.0
        type: string
        required: true
      npm_bootstrap:
        description: >-
          First npmjs.com release of a package only: stage it with the NPM_TOKEN
          secret, to approve on npmjs.com (see the npmjs job).
        type: boolean
        default: false

# Least privilege: grant per job, nothing at the top level.
permissions: {}

concurrency:
  group: js-release
  cancel-in-progress: false

jobs:
  # --- Which npm packages, at which version and git ref? ---------------------
  plan:
    name: Release plan
    if: ${{ github.repository == 'open-lakehouse/mangrove' && vars.JS_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      napi: ${{ steps.plan.outputs.napi }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - name: Resolve packages
        id: plan
        env:
          RELEASES: ${{ inputs.releases }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Crate -> workspace dir. Keep in sync with release-plz.toml.
          dirs='{"unity-catalog-node":"node/client","unity-catalog-client":"node/unity-catalog-client","arrow-grid":"node/arrow-grid","editor":"node/editor","volume-files":"node/volume-files","delta-log":"node/delta-log","query-runner":"node/query-runner","unity-catalog-ui":"node/unity-catalog-ui"}'
          if [ -n "${TAG:-}" ]; then
            # workflow_dispatch: one existing `<crate>-v<version>` tag.
            crate="${TAG%-v*}"
            version="${TAG##*-v}"
            RELEASES=$(jq -nc --arg c "$crate" --arg v "$version" --arg t "$TAG" \
              '[{package_name: $c, version: $v, tag: $t}]')
            ref="refs/tags/$TAG"
          else
            ref="$SHA"
          fi
          packages=$(jq -c --argjson dirs "$dirs" '
            map(select($dirs[.package_name]) | {crate: .package_name, version, tag, dir: $dirs[.package_name]})
          ' <<<"$RELEASES")
          if [ "$(jq length <<<"$packages")" -eq 0 ]; then
            echo "::error::no npm package in: $RELEASES"
            exit 1
          fi
          {
            echo "packages=$packages"
            echo "napi=$(jq 'any(.crate == "unity-catalog-node")' <<<"$packages")"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: $packages (ref $ref)"

  # --- Build the NAPI binary for every target -------------------------------
  # The matrix must list exactly the `napi.targets` in node/client/package.json,
  # or `napi pre-publish` expects binaries that were never built.
  # (Per-PR / host-target build coverage lives in node-ci.yaml.)
  napi-build:
    name: napi (${{ matrix.target }})
    needs: [plan]
    if: ${{ needs.plan.outputs.napi == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}

      # One cache per target (release builds are rare, so this mostly saves the
      # registry download and dependency builds on re-runs).
      # `env-vars: ImageOS` hashes the runner image (`ubuntu24`, `ubuntu26`, …)
      # into the cache key. Without it a cache saved on one image restores on
      # another, and stale build-script output (e.g. pyo3's resolved
      # `libpython3.12` from ubuntu-24.04) breaks linking on the new image.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
          key: napi-${{ matrix.target }}

      # musl targets cross-compile through cargo-zigbuild (`napi build -x`), with
      # zig as the C compiler/linker. The runners have no musl C toolchain, and
      # crates with C code (ring) can't build without one. Same setup as the
      # napi-rs package template.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: ${{ contains(matrix.target, 'musl') }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      # `-- --locked` forwards to cargo so the NAPI build resolves strictly from
      # Cargo.lock and can never silently re-resolve a git dep to a drifted rev
      # (mirrors node-ci.yaml). musl legs add `-x` (cargo-zigbuild, see above).
      - name: Build NAPI binding
        run: bunx napi build --platform --release --target ${{ matrix.target }} ${{ contains(matrix.target, 'musl') && '-x' || '' }} --output-dir unitycatalog/codegen --dts native.d.ts --js native.js -- --locked
        working-directory: node/client

      - name: Upload .node artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-${{ matrix.target }}
          path: node/client/unitycatalog/codegen/*.node
          if-no-files-found: error

  # --- Build and pack every released package once ---------------------------
  # `always()` lets it run when `napi-build` was skipped because no NAPI package
  # was released; it still refuses to run if that build failed. The registry
  # jobs below all ship these exact tarballs.
  pack:
    name: Build and pack
    needs: [plan, napi-build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.napi-build.result == 'success' || needs.napi-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PACKAGES: ${{ needs.plan.outputs.packages }}
      NAPI: ${{ needs.plan.outputs.napi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      # package.json carries 0.0.0 in git; each package's crate version is its npm
      # version. Stamp every package, not only the released ones, so a
      # `workspace:` dependency on an unreleased sibling packs as that sibling's
      # published version instead of 0.0.0.
      - name: Stamp versions
        run: bun run scripts/stamp-npm-versions.ts --expect "$PACKAGES"

      # node/client's `build` script compiles a debug binary; its JS/declaration
      # build is `tsc` (the release binaries come from `napi-build`).
      - name: Build
        run: |
          set -euo pipefail
          for dir in $(jq -r '.[].dir' <<<"$PACKAGES"); do
            if [ "$dir" = node/client ]; then
              (cd "$dir" && bun run tsc)
            else
              (cd "$dir" && bun run build)
            fi
          done

      - name: Download NAPI artifacts
        if: ${{ needs.plan.outputs.napi == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          path: node/client/artifacts

      # `napi version` syncs the per-platform packages under npm/ to the stamped
      # version, `napi artifacts` copies each downloaded binary into its platform
      # package, and `napi pre-publish --skip-optional-publish` pins them as
      # optionalDependencies of the main package without publishing them: they
      # are packed below and published by the registry jobs like every other
      # package, so they reach both registries.
      - name: Prepare NAPI platform packages
        if: ${{ needs.plan.outputs.napi == 'true' }}
        working-directory: node/client
        run: |
          set -euo pipefail
          bunx napi version
          bunx napi artifacts --output-dir artifacts
          bunx napi pre-publish -t npm --skip-optional-publish

      # Platform packages go into `platform/`, which the registry jobs publish
      # first, so the main package never points at a binary that isn't there.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs/platform"
          echo '[]' > "$RUNNER_TEMP/tarballs/attach.json"
          jq -c '.[]' <<<"$PACKAGES" | while read -r p; do
            dir=$(jq -r .dir <<<"$p")
            (cd "$dir" && bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/tarballs")
            # Which tarball goes on which GitHub Release (see github-release).
            tgz="$(jq -r '.name | ltrimstr("@") | gsub("/"; "-")' "$dir/package.json")-$(jq -r .version <<<"$p").tgz"
            jq --arg tag "$(jq -r .tag <<<"$p")" --arg tgz "$tgz" '. + [{tag: $tag, tgz: $tgz}]' \
              "$RUNNER_TEMP/tarballs/attach.json" > "$RUNNER_TEMP/attach.json"
            mv "$RUNNER_TEMP/attach.json" "$RUNNER_TEMP/tarballs/attach.json"
          done
          if [ "$NAPI" = true ]; then
            for dir in node/client/npm/*/; do
              (cd "$dir" && bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/tarballs/platform")
            done
          fi
          ls -lR "$RUNNER_TEMP/tarballs"

      # A packed manifest must not depend on a workspace protocol or on a
      # sibling's unstamped 0.0.0, and must not carry a publishConfig registry
      # (it would override the registry each job publishes to).
      - name: Check packed manifests
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP"/tarballs/*.tgz "$RUNNER_TEMP"/tarballs/platform/*.tgz; do
            [ -e "$tgz" ] || continue
            manifest=$(tar -xOzf "$tgz" package/package.json)
            bad=$(jq -r '
              [.dependencies, .peerDependencies, .optionalDependencies]
              | map(select(. != null) | to_entries[]) | .[]
              | select((.value | startswith("workspace:"))
                  or (.key | startswith("@open-lakehouse/")) and (.value | test("(^|[^0-9.])0\\.0\\.0$")))
              | "\(.key)@\(.value)"' <<<"$manifest")
            if [ -n "$bad" ]; then
              echo "::error::$(basename "$tgz") has unpublishable dependency specs: $bad"
              exit 1
            fi
            if [ "$(jq -r '.publishConfig.registry // empty' <<<"$manifest")" != "" ]; then
              echo "::error::$(basename "$tgz") sets publishConfig.registry"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  # --- Publish to GitHub Packages --------------------------------------------
  # No OIDC exchange there, so the job's own short-lived GITHUB_TOKEN publishes.
  # A version the registry already has is skipped, so re-runs are safe.
  github-packages:
    name: Publish to GitHub Packages
    needs: [plan, pack]
    if: ${{ always() && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # protected env, mirrors release-plz
    permissions:
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs

      # Writes an .npmrc mapping @open-lakehouse to GitHub Packages with
      # NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@open-lakehouse"
          package-manager-cache: false

      - name: Publish
        # zizmor: ignore[use-trusted-publishing] — npm trusted publishing (OIDC)
        # exists only for registry.npmjs.org; GitHub Packages authenticates the
        # job's own ephemeral GITHUB_TOKEN, so no long-lived credential exists.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tgz in "$RUNNER_TEMP"/tarballs/platform/*.tgz "$RUNNER_TEMP"/tarballs/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | jq -r '"\(.name)@\(.version)"')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on GitHub Packages; skipping."
              continue
            fi
            npm publish "$tgz"
          done

  # --- Publish to npmjs.com --------------------------------------------------
  # Trusted publishing (OIDC) with npm provenance. The trusted publisher only
  # allows *staged* publishing: this job runs `npm stage publish`, and a version
  # goes live once a maintainer approves it on npmjs.com (or `npm stage
  # approve`) with 2FA. npm checks the *calling* workflow, so each package's
  # trusted publisher is registered for `release-plz.yml` with the `release`
  # environment.
  #
  # Gated on the `NPMJS_PUBLISH_ENABLED` repo variable, so releases keep going
  # to GitHub Packages until every package is bootstrapped. The one-time
  # bootstrap of a new package name (OIDC cannot create a package): store an npm
  # token that can stage to @open-lakehouse as NPM_TOKEN in the `release`
  # environment, run this workflow from `main` with the package's tag and
  # `npm_bootstrap=true`, approve the staged versions on npmjs.com, register the
  # trusted publisher (release-plz.yml, environment `release`, stage publish
  # only) and delete the token. npm expires a trusted publisher that hasn't
  # published within 2 days of being registered, so register it shortly before
  # the package's next release.
  npmjs:
    name: Publish to npmjs.com
    needs: [plan, pack]
    if: ${{ always() && needs.pack.result == 'success' && (vars.NPMJS_PUBLISH_ENABLED == 'true' || inputs.npm_bootstrap) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The trusted publisher on npmjs.com is bound to this environment.
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # `npm stage publish` needs npm >= 11.15.0, newer than Node 24 may bundle.
      - name: Install an npm that can stage
        # zizmor: ignore[adhoc-packages] — the npm CLI itself, pinned to an
        # exact release.
        run: npm install --global npm@11.21.0

      # `npm view` only sees approved versions: a re-run before a staged
      # version is approved stages it again, which npm rejects. Approve the
      # pending version instead.
      - name: Stage
        env:
          BOOTSTRAP: ${{ inputs.npm_bootstrap }}
          # npm prefers the OIDC exchange and only falls back to NODE_AUTH_TOKEN
          # when it fails, which is the case before a trusted publisher exists.
          # Outside the bootstrap the token is empty, so only OIDC can stage.
          # zizmor: ignore[use-trusted-publishing] — creating a package is the
          # one thing OIDC cannot do. The token only stages; a maintainer
          # promotes the version on npmjs.com with 2FA.
          NODE_AUTH_TOKEN: ${{ inputs.npm_bootstrap && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tgz in "$RUNNER_TEMP"/tarballs/platform/*.tgz "$RUNNER_TEMP"/tarballs/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | jq -r '"\(.name)@\(.version)"')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npmjs.com; skipping."
              continue
            fi
            npm stage publish "$tgz" --access public --provenance
            echo "::notice::Staged $spec. Approve it on npmjs.com (or \`npm stage approve\`) with 2FA to publish it."
          done
          if [ "$BOOTSTRAP" = true ]; then
            echo "::notice::Bootstrap: after approving, register each package's trusted publisher and delete NPM_TOKEN."
          fi

  # --- Attest and attach to the GitHub Releases -------------------------------
  # Key-free SLSA build provenance over the exact bytes both registries receive
  # (GitHub Packages can't carry npm provenance); verify with
  # `gh attestation verify <file> -R open-lakehouse/mangrove`. release-plz
  # already created each package's GitHub Release (with its changelog); the
  # main tarball is attached to it.
  github-release:
    name: Attest and attach to the GitHub Releases
    needs: [plan, pack]
    if: ${{ always() && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # attach the tarballs to the GitHub Releases
      id-token: write # OIDC for build-provenance attestations
      attestations: write # write the attestation to the attestations store
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/tarballs/*.tgz
            ${{ runner.temp }}/tarballs/platform/*.tgz

      - name: Attach tarballs to the GitHub Releases
        run: |
          set -euo pipefail
          jq -c '.[]' "$RUNNER_TEMP/tarballs/attach.json" | while read -r a; do
            gh release upload "$(jq -r .tag <<<"$a")" "$RUNNER_TEMP/tarballs/$(jq -r .tgz <<<"$a")" \
              --clobber -R "$GITHUB_REPOSITORY"
          done
