name: js-release

# The JS release pipeline (the counterpart to release-plz for the Rust crates),
# mirroring its two-job shape: on every push to `main` the `version-pr` job
# derives `.changeset/*.md` from the `node/**` conventional commits and, via the
# Changesets action, opens/updates a single "Version Packages" PR carrying those
# entries + the version bumps + per-package CHANGELOGs. Nothing lands on `main`
# — the version state lives on the action's `changeset-release/main` PR branch.
#
# DORMANT: while the `JS_PUBLISH_ENABLED` repo variable is unset/not "true", the
# `napi-build` matrix and `publish` job DO NOT RUN AT ALL — only `version-pr`
# runs, maintaining the "Version Packages" PR. This keeps the machinery in place
# without building or publishing anything on ordinary pushes. Today
# only `@open-lakehouse/uc-client` (+ its platform packages) is non-private; every
# `@open-lakehouse/*` package is `private: true` and skipped.
#
# WHEN PUBLISHING GOES LIVE (`JS_PUBLISH_ENABLED=true`): the build/publish gate
# is `hasChangesets == 'false'` (no changesets left ⇒ the Version PR was merged).
# NOTE that `hasChangesets` is `false` both right after a merge AND at rest (a
# push that produced no changeset), so it is NOT a clean "was released this run"
# signal on its own — the eventual correct gate is the Changesets action's
# `published` output (the JS analogue of release-plz's `server_version != ''`).
# The `JS_PUBLISH_ENABLED` clause below is what prevents the resting-state
# `hasChangesets == 'false'` from firing spurious multi-arch builds while dormant;
# revisit the gate (switch to `published`) as part of enabling publishing. See #182.
#
# See .changeset/README.md and .agents/rules/js-release-changesets-rule.mdc.

on:
  push:
    branches:
      - main

# Least privilege: grant per job, nothing at the top level.
permissions: {}

concurrency:
  group: js-release
  cancel-in-progress: false

jobs:
  # --- Open/update the "Version Packages" PR (version bumps + changelogs) -----
  version-pr:
    name: Version Packages PR
    if: ${{ github.repository == 'open-lakehouse/mangrove' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open/update the Version Packages PR
    # `hasChangesets` is 'true' while a release is still pending (the Version PR
    # is open/updated) and 'false' once it has been merged (nothing left to
    # version). The `napi-build` + `publish` jobs gate on 'false' so the
    # expensive multi-arch build + npm publish run ONLY when a release is due —
    # the JS analogue of release-plz gating Docker on "was it released this run".
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      # Derive `.changeset/*.md` from the `node/**` conventional commits since the
      # last release (the "automatic" half — the counterpart to release-plz
      # reading commits). The script is idempotent per HEAD sha and writes nothing
      # when there is no release-worthy commit. Crucially this only stages files in
      # the working tree; the Changesets action below carries them onto its PR
      # branch, so NOTHING is ever committed to `main`. A hand-written changeset
      # still wins (`changeset version` takes the highest bump per package).
      - name: Generate changesets from node/ commits
        run: bun run scripts/autogen-changeset.ts

      # Opens/updates the Version Packages PR. `version` runs `changeset version`
      # (bumps + changelogs) and commits both the generated changesets and the
      # bumps to the `changeset-release/main` branch. We do NOT set `publish` here
      # — publishing is handled by the gated `publish` job below so the NAPI matrix
      # build runs first. `id:` exposes `hasChangesets` for the release gate.
      - name: Changesets Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          commit: "chore(release): version JS packages"
          title: "chore(release): version JS packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # --- Build the NAPI binary for every target -------------------------------
  # DORMANT: never runs while `JS_PUBLISH_ENABLED` is unset (the machinery is set
  # up but builds nothing yet). When enabled, gated additionally on a release
  # being due — `hasChangesets == 'false'` (Version PR merged, no changesets
  # left). The `JS_PUBLISH_ENABLED` clause is essential: `hasChangesets` is also
  # `false` at rest, so without it an ordinary push would fire this whole matrix.
  # (Per-PR / host-target build coverage lives in node-ci.yaml.)
  napi-build:
    name: napi (${{ matrix.target }})
    needs: [version-pr]
    if: ${{ github.repository == 'open-lakehouse/mangrove' && vars.JS_PUBLISH_ENABLED == 'true' && needs.version-pr.outputs.hasChangesets == 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      # `-- --locked` forwards to cargo so the NAPI build resolves strictly from
      # Cargo.lock and can never silently re-resolve a git dep to a drifted rev
      # (mirrors node-ci.yaml). musl legs get the target via the napi CLI's
      # zig/cross handling; add explicit cross tooling here if a leg fails.
      - name: Build NAPI binding
        run: bunx napi build --platform --release --target ${{ matrix.target }} --output-dir unitycatalog/codegen --dts native.d.ts --js native.js -- --locked
        working-directory: node/client

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: node/client/unitycatalog/codegen/*.node
          if-no-files-found: error

  # --- Publish to npm (DORMANT until JS_PUBLISH_ENABLED=true) -----------------
  # Never runs while dormant (same gate as `napi-build`, and it `needs` it). When
  # enabled, runs only when a release is due (`hasChangesets == 'false'`, Version
  # PR merged).
  publish:
    name: Publish (npm)
    needs: [version-pr, napi-build]
    if: ${{ github.repository == 'open-lakehouse/mangrove' && vars.JS_PUBLISH_ENABLED == 'true' && needs.version-pr.outputs.hasChangesets == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release # protected env, mirrors release-plz
    permissions:
      contents: read
      id-token: write # npm provenance / OIDC
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      - name: Download NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: node/client/artifacts

      # napi artifacts copies each per-target .node into its platform package dir
      # under node/client/npm/<platform>/ (and the root) so `napi pre-publish`
      # can publish the platform packages and merge their optionalDependencies.
      - name: Place artifacts into platform packages
        run: bunx napi artifacts --output-dir artifacts
        working-directory: node/client

      # The whole `publish` job only runs when JS_PUBLISH_ENABLED == 'true' (see
      # the job `if:`), so this is always a live publish — there is no dry-run
      # branch. While dormant the job never runs at all.
      - name: Publish (live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Platform packages + optionalDependencies merge first (in the NAPI
          # package), then the root + any other public workspace packages via
          # the workspace-aware changeset publish at the repo root.
          ( cd node/client && bunx napi pre-publish -t npm )
          bun run changeset:publish
