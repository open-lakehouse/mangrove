name: js-release

# Publishes the npm packages to GitHub Packages (npm.pkg.github.com). Only
# GitHub Packages for now (no npmjs) while downstream projects validate the
# packages.
#
# release-plz owns versioning: each npm package is a crate in release-plz.toml
# (`unity-catalog-node` = the NAPI extension in node/client, `unity-catalog-client`
# = a placeholder crate in node/unity-catalog-client). release-plz bumps the
# crate version from conventional commits, writes the CHANGELOG, tags
# `<crate>-v<version>` and creates the GitHub Release. release-plz.yml then calls
# this workflow with the npm packages it released this run. package.json
# versions stay 0.0.0 in git; the released version is stamped in here.
#
# Per package: stamp the version, build, (NAPI) build each target binary and
# publish the per-platform packages, pack, attest the tarballs + binaries
# (GitHub Packages has no npm provenance), publish, and attach the tarball to the
# package's GitHub Release.
#
# Kill switch: nothing is built or published unless the `JS_PUBLISH_ENABLED`
# repo variable is "true". A release cut while it was off (or a failed publish)
# can be published later with workflow_dispatch and the release tag.

on:
  workflow_call:
    inputs:
      releases:
        description: >-
          JSON array of the npm-package crates release-plz released, as in its
          `releases` output: [{"package_name": "...", "version": "...", "tag": "..."}].
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. unity-catalog-node-v0.2.0
        type: string
        required: true

# Least privilege: grant per job, nothing at the top level.
permissions: {}

concurrency:
  group: js-release
  cancel-in-progress: false

jobs:
  # --- Which npm packages, at which version and git ref? ---------------------
  plan:
    name: Release plan
    if: ${{ github.repository == 'open-lakehouse/mangrove' && vars.JS_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      napi: ${{ steps.plan.outputs.napi }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - name: Resolve packages
        id: plan
        env:
          RELEASES: ${{ inputs.releases }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Crate -> workspace dir. Keep in sync with release-plz.toml.
          dirs='{"unity-catalog-node":"node/client","unity-catalog-client":"node/unity-catalog-client"}'
          if [ -n "${TAG:-}" ]; then
            # workflow_dispatch: one existing `<crate>-v<version>` tag.
            crate="${TAG%-v*}"
            version="${TAG##*-v}"
            RELEASES=$(jq -nc --arg c "$crate" --arg v "$version" --arg t "$TAG" \
              '[{package_name: $c, version: $v, tag: $t}]')
            ref="refs/tags/$TAG"
          else
            ref="$SHA"
          fi
          packages=$(jq -c --argjson dirs "$dirs" '
            map(select($dirs[.package_name]) | {crate: .package_name, version, tag, dir: $dirs[.package_name]})
          ' <<<"$RELEASES")
          if [ "$(jq length <<<"$packages")" -eq 0 ]; then
            echo "::error::no npm package in: $RELEASES"
            exit 1
          fi
          {
            echo "packages=$packages"
            echo "napi=$(jq 'any(.crate == "unity-catalog-node")' <<<"$packages")"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: $packages (ref $ref)"

  # --- Build the NAPI binary for every target -------------------------------
  # The matrix must list exactly the `napi.targets` in node/client/package.json,
  # or `napi pre-publish` expects binaries that were never built.
  # (Per-PR / host-target build coverage lives in node-ci.yaml.)
  napi-build:
    name: napi (${{ matrix.target }})
    needs: [plan]
    if: ${{ needs.plan.outputs.napi == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      # One cache per target (release builds are rare, so this mostly saves the
      # registry download and dependency builds on re-runs).
      # `env-vars: ImageOS` hashes the runner image (`ubuntu24`, `ubuntu26`, …)
      # into the cache key. Without it a cache saved on one image restores on
      # another, and stale build-script output (e.g. pyo3's resolved
      # `libpython3.12` from ubuntu-24.04) breaks linking on the new image.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
          key: napi-${{ matrix.target }}

      # musl targets cross-compile through cargo-zigbuild (`napi build -x`), with
      # zig as the C compiler/linker. The runners have no musl C toolchain, and
      # crates with C code (ring) can't build without one. Same setup as the
      # napi-rs package template.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: ${{ contains(matrix.target, 'musl') }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      # `-- --locked` forwards to cargo so the NAPI build resolves strictly from
      # Cargo.lock and can never silently re-resolve a git dep to a drifted rev
      # (mirrors node-ci.yaml). musl legs add `-x` (cargo-zigbuild, see above).
      - name: Build NAPI binding
        run: bunx napi build --platform --release --target ${{ matrix.target }} ${{ contains(matrix.target, 'musl') && '-x' || '' }} --output-dir unitycatalog/codegen --dts native.d.ts --js native.js -- --locked
        working-directory: node/client

      - name: Upload .node artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-${{ matrix.target }}
          path: node/client/unitycatalog/codegen/*.node
          if-no-files-found: error

  # --- Publish to GitHub Packages --------------------------------------------
  # `always()` lets it run when `napi-build` was skipped because only the TS
  # client was released; it still refuses to run if that build failed.
  publish:
    name: Publish (GitHub Packages)
    needs: [plan, napi-build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.napi-build.result == 'success' || needs.napi-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release # protected env, mirrors release-plz
    permissions:
      contents: write # attach the tarballs to the GitHub Releases
      packages: write # publish to GitHub Packages
      id-token: write # build-provenance attestation
      attestations: write # build-provenance attestation
    env:
      PACKAGES: ${{ needs.plan.outputs.packages }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Writes an .npmrc mapping @open-lakehouse to GitHub Packages with
      # NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@open-lakehouse"

      - name: Install dependencies
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile

      # package.json carries 0.0.0 in git; the crate version release-plz just
      # released is the npm version.
      - name: Stamp versions
        run: |
          set -euo pipefail
          jq -c '.[]' <<<"$PACKAGES" | while read -r p; do
            dir=$(jq -r .dir <<<"$p")
            version=$(jq -r .version <<<"$p")
            jq --arg v "$version" '.version = $v' "$dir/package.json" > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" "$dir/package.json"
            echo "$(jq -r .name "$dir/package.json")@$version"
          done

      # node/client's `build` script compiles a debug binary; its JS/declaration
      # build is `tsc` (the release binaries come from `napi-build`).
      - name: Build
        run: |
          set -euo pipefail
          for dir in $(jq -r '.[].dir' <<<"$PACKAGES"); do
            if [ "$dir" = node/client ]; then
              (cd "$dir" && bun run tsc)
            else
              (cd "$dir" && bun run build)
            fi
          done

      - name: Download NAPI artifacts
        if: ${{ needs.plan.outputs.napi == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          path: node/client/artifacts

      # `napi version` syncs the per-platform packages under npm/ to the stamped
      # version, `napi artifacts` copies each downloaded binary into its platform
      # package, and `napi pre-publish` publishes those platform packages
      # (registry from their publishConfig) and pins them as optionalDependencies
      # of the main package, which is packed and published below.
      - name: Publish NAPI platform packages
        if: ${{ needs.plan.outputs.napi == 'true' }}
        working-directory: node/client
        run: |
          set -euo pipefail
          bunx napi version
          bunx napi artifacts --output-dir artifacts
          bunx napi pre-publish -t npm

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in $(jq -r '.[].dir' <<<"$PACKAGES"); do
            (cd "$dir" && bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/tarballs")
          done
          ls -l "$RUNNER_TEMP/tarballs"

      # GitHub Packages doesn't support npm provenance, so attest the exact
      # tarballs (and the platform binaries) instead; consumers verify with
      # `gh attestation verify <file> -R open-lakehouse/mangrove`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/tarballs/*.tgz
            node/client/npm/*/*.node

      - name: Publish tarballs
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP"/tarballs/*.tgz; do
            npm publish "$tgz"
          done

      # release-plz already created each package's GitHub Release (with its
      # changelog); attach the published tarball to it.
      - name: Attach tarballs to the GitHub Releases
        run: |
          set -euo pipefail
          jq -c '.[]' <<<"$PACKAGES" | while read -r p; do
            dir=$(jq -r .dir <<<"$p")
            tag=$(jq -r .tag <<<"$p")
            tgz="$RUNNER_TEMP/tarballs/$(jq -r '.name | ltrimstr("@") | gsub("/"; "-")' "$dir/package.json")-$(jq -r .version <<<"$p").tgz"
            gh release upload "$tag" "$tgz" --clobber -R "$GITHUB_REPOSITORY"
          done
