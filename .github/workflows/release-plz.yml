name: Release-plz

# Automated releases. On every push to `main`, release-plz opens/updates a
# single "Release PR" containing per-crate version bumps + regenerated
# changelogs. When that PR is merged, release-plz creates the per-crate git tags
# + GitHub Releases and publishes the crates to crates.io via OIDC trusted
# publishing.
#
# The server (`olai-uc-server`) is a DEPLOYABLE, not a crates.io library: it is
# `git_only` in release-plz.toml (tagged from git, never published) and ships as
# the `mangrove` container image instead. After the release job, the `docker`
# job builds + pushes it to GHCR via a reusable workflow (workflow_call), keyed
# off the version release-plz just tagged. Running it in the SAME workflow keeps
# the build explicitly gated on "the server was released this run" — no second
# trigger to reason about, and the version is passed in directly rather than
# re-derived from a tag event. The server's bundled web UI (node/) releases the
# server through the `uc-app` placeholder crate and `changelog_include` (see
# release-plz.toml), so a UI-only change also lands here as a server release.
#
# Bootstrap note: crates with `release = false` in release-plz.toml have not yet
# had their one-time token bootstrap publish (.github/workflows/bootstrap-
# publish.yml) and are versioned/tagged but not published here. See CONTRIBUTING.md.
#
# The npm packages ride along the same way: release-plz versions them through
# crates (node/client is the NAPI extension, node/unity-catalog-client a
# placeholder), and when this run releases one, the `npm` job (a workflow_call
# into js-release.yaml) publishes it to GitHub Packages.
#
# See release-plz.toml; CONTRIBUTING.md has the full flow.

on:
  push:
    branches:
      - main

# Least privilege: grant per job, nothing at the top level.
permissions: {}

jobs:
  # --- Open/update the Release PR (version bumps + changelogs) ---
  release-plz-pr:
    name: Release PR
    # Never run from forks — they must not open release PRs.
    if: ${{ github.repository == 'open-lakehouse/mangrove' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release-plz-* branch
      pull-requests: write # create/update the Release PR
    # Avoid two pushes to main racing to open/update the same PR.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # release-plz needs full history to analyze commits
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          # Matches the rest of CI; stays above the 1.95.0 workspace floor.
          toolchain: "1.97"
      - name: Run release-plz (release-pr)
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          # SQLX_OFFLINE so cargo-semver-checks / metadata don't probe a live DB.
          SQLX_OFFLINE: "true"
          # Optional PAT/App token so the Release PR runs CI under a non-
          # GITHUB_TOKEN identity (a PR opened with GITHUB_TOKEN doesn't itself
          # start PR checks). Falls back to GITHUB_TOKEN when unset.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # --- Tag + GitHub Release + cargo publish, after the Release PR is merged ---
  # release-plz publishes every crate whose `release` is not false to crates.io
  # via OIDC, and creates each released crate's git tag + GitHub Release. The
  # server (`olai-uc-server`) is one of those published crates — release-plz tags
  # it `olai-uc-server-v<version>`, publishes it, and lists it in the `release`
  # command's `releases` JSON. We read that JSON to learn whether the server was
  # released this run and, if so, drive the Docker image build off it. (Before the
  # server became a published crate it was `git_only`, which is omitted from
  # `releases` — that forced a bespoke tag-creation shell step here; publishing
  # the server let us delete it and gate Docker off release-plz's own output.)
  release-plz-release:
    name: Release
    if: ${{ github.repository == 'open-lakehouse/mangrove' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release # protected env gating the crates.io publish
    permissions:
      contents: write # create tags + GitHub Releases
      id-token: write # crates.io OIDC publish
    outputs:
      # server version + tag IF release-plz released the server this run, else
      # empty — the Docker job keys off this.
      server_version: ${{ steps.server.outputs.version }}
      server_tag: ${{ steps.server.outputs.tag }}
      # Likewise for the standalone storage-proxy image — its own Docker job keys
      # off these.
      storage_proxy_version: ${{ steps.storage_proxy.outputs.version }}
      storage_proxy_tag: ${{ steps.storage_proxy.outputs.tag }}
      # Likewise for the standalone files-api image — its own Docker job keys off
      # these.
      files_api_version: ${{ steps.files_api.outputs.version }}
      files_api_tag: ${{ steps.files_api.outputs.tag }}
      # The npm-package crates (unity-catalog-node, unity-catalog-client)
      # released this run, as a JSON array of release entries ("[]" if none) —
      # the `npm` job keys off this.
      npm_releases: ${{ steps.npm.outputs.releases }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97"
      # No CARGO_REGISTRY_TOKEN: crates.io publish authenticates via OIDC
      # (`id-token: write`). Crates with `release = false` are skipped.
      - name: Run release-plz (release)
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          SQLX_OFFLINE: "true"
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # Did release-plz release the server this run? Its `release` step emits a
      # `releases` JSON array (one object per released crate, each with
      # `package_name` / `version` / `tag`). Filter for `olai-uc-server`; if
      # present, surface its version + tag so the Docker job fires. If the server
      # was not bumped this run (or is still bootstrap-gated `release = false`),
      # the array has no such entry, the outputs stay empty, and Docker is skipped.
      - name: Detect server release
        id: server
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          entry=$(printf '%s' "${RELEASES:-[]}" \
            | jq -c '.[] | select(.package_name == "olai-uc-server")')
          if [ -n "$entry" ]; then
            version=$(printf '%s' "$entry" | jq -r '.version')
            tag=$(printf '%s' "$entry" | jq -r '.tag')
            echo "Server released this run: ${version} (tag ${tag})."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "Server not released this run — Docker build skipped."
          fi
      # Same detection for the standalone storage-proxy: it ships as its own GHCR
      # image (`storage-proxy`), so gate its Docker build on whether release-plz
      # released `olai-uc-storage-proxy` this run.
      - name: Detect storage-proxy release
        id: storage_proxy
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          entry=$(printf '%s' "${RELEASES:-[]}" \
            | jq -c '.[] | select(.package_name == "olai-uc-storage-proxy")')
          if [ -n "$entry" ]; then
            version=$(printf '%s' "$entry" | jq -r '.version')
            tag=$(printf '%s' "$entry" | jq -r '.tag')
            echo "Storage-proxy released this run: ${version} (tag ${tag})."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "Storage-proxy not released this run — Docker build skipped."
          fi
      # Same detection for the standalone files-api: it ships as its own GHCR image
      # (`files-api`), so gate its Docker build on whether release-plz released
      # `olai-uc-files-api` this run. While the crate carries `release = false`
      # (bootstrap gate — see release-plz.toml) it is never in `releases`, so this
      # stays empty and the Docker job is skipped; removing that gate activates it.
      - name: Detect files-api release
        id: files_api
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          entry=$(printf '%s' "${RELEASES:-[]}" \
            | jq -c '.[] | select(.package_name == "olai-uc-files-api")')
          if [ -n "$entry" ]; then
            version=$(printf '%s' "$entry" | jq -r '.version')
            tag=$(printf '%s' "$entry" | jq -r '.tag')
            echo "Files-api released this run: ${version} (tag ${tag})."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "Files-api not released this run — Docker build skipped."
          fi

      # The npm packages are versioned through crates (see release-plz.toml):
      # collect the ones released this run for the `npm` job.
      - name: Detect npm package releases
        id: npm
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          releases=$(printf '%s' "${RELEASES:-[]}" \
            | jq -c '[.[] | select(.package_name == "unity-catalog-node" or .package_name == "unity-catalog-client")]')
          echo "npm packages released this run: $releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  # --- Publish the released npm packages to GitHub Packages ---
  npm:
    name: npm release
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.npm_releases != '' && needs.release-plz-release.outputs.npm_releases != '[]' }}
    permissions:
      # The called workflow's jobs may request at most what is granted here.
      contents: write # attach tarballs to the GitHub Releases
      packages: write # publish to GitHub Packages
      id-token: write # build-provenance attestation
      attestations: write # build-provenance attestation
    uses: ./.github/workflows/js-release.yaml
    with:
      releases: ${{ needs.release-plz-release.outputs.npm_releases }}

  # --- Build + push the server (mangrove) Docker image, iff it was released ---
  docker:
    name: Docker release
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.server_version != '' }}
    permissions:
      # contents: write (not read) — the reusable workflow's `merge` job edits
      # the GitHub Release + uploads provenance assets (added in #52). A called
      # workflow's jobs may request at most what the caller grants, so `read`
      # here fails the whole file at startup ("nested job 'merge' is requesting
      # 'contents: write', but is only allowed 'contents: read'").
      contents: write
      packages: write
      id-token: write
    # One generic reusable workflow builds every image; per-image differences are
    # passed as inputs (see docker-release.yml). This replaced three byte-identical
    # copies whose forgotten per-image artifact name let concurrent merge jobs
    # collide on shared `digests-*` artifacts.
    uses: ./.github/workflows/docker-release.yml
    with:
      image: mangrove
      dockerfile: crates/server/Dockerfile
      tag_prefix: olai-uc-server
      title: mangrove
      description: Mangrove — a lakehouse catalog server (Unity Catalog + Delta Sharing APIs) with bundled web UI
      version: ${{ needs.release-plz-release.outputs.server_version }}
      ref: ${{ needs.release-plz-release.outputs.server_tag }}

  # --- Build + push the standalone storage-proxy image, iff it was released ---
  docker-storage-proxy:
    name: Docker release (storage-proxy)
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.storage_proxy_version != '' }}
    permissions:
      # contents: write for the same reason as the `docker` job above — the
      # reusable workflow's `merge` job edits the GitHub Release + uploads
      # provenance assets.
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-release.yml
    with:
      image: storage-proxy
      dockerfile: crates/storage-proxy/Dockerfile
      tag_prefix: olai-uc-storage-proxy
      title: storage-proxy
      description: Standalone Unity Catalog storage byte-proxy — same-origin, streaming reads/writes over governed securables
      version: ${{ needs.release-plz-release.outputs.storage_proxy_version }}
      ref: ${{ needs.release-plz-release.outputs.storage_proxy_tag }}

  # --- Build + push the standalone files-api image, iff it was released ---
  docker-files-api:
    name: Docker release (files-api)
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.files_api_version != '' }}
    permissions:
      # contents: write for the same reason as the `docker` job above — the
      # reusable workflow's `merge` job edits the GitHub Release + uploads
      # provenance assets.
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-release.yml
    with:
      image: files-api
      dockerfile: crates/files-api/Dockerfile
      tag_prefix: olai-uc-files-api
      title: files-api
      description: Standalone Unity Catalog volume Files API — a ConnectRPC portal.files.v1.FilesService server
      version: ${{ needs.release-plz-release.outputs.files_api_version }}
      ref: ${{ needs.release-plz-release.outputs.files_api_tag }}
