# The in-browser query-engine workspace — a STANDALONE cargo workspace, separate
# from the repo-root (native) workspace at `../Cargo.toml`.
#
# Why its own workspace: the cdylib needs a size-tuned `[profile.release]`
# (opt-level="s", lto, ...) and it pins a heavily-customized delta stack that must
# NOT leak into the native server build — the roeap `delta_kernel` fork's
# experimental `sm-plans` line (rev c7bc4254), the matching `roeap/delta-rs` rev
# (d2d0cbae), and a `[patch.crates-io]` on the whole arrow-rs family + object_store
# (the roeap wasm-codec / browser-Fetch forks). Keeping this in a distinct
# workspace + lock is exactly what lets `../Cargo.toml` stay on stock crates.io
# arrow/object_store and a lighter (buoyant/main) kernel — see #182.
#
# The two workspaces are now INDEPENDENT graphs with independent `Cargo.lock`s:
# there is deliberately no shared kernel/arrow rev between them (the old
# single-rev invariant is gone). This workspace owns the fork stack; the native
# one owns none of it.
#
# Members:
#   * `query-wasm`     — the wasm-bindgen surface + UC glue (was `crates/query-wasm`).
#   * `olai-delta-df`  — the async-native (sm_plans-driven) Delta `TableProvider`
#                        (was `crates/olai-delta-df`; its ONLY consumer is query-wasm).
# Both stay `publish = false`.
[workspace]
resolver = "2"
members = ["query-wasm", "olai-delta-df"]

# The cdylib ships to browsers: optimize release for size. (Further shrinking —
# wasm-opt -Oz, panic=abort — tracked with the browser-verification follow-up.)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

# wasm-engine: patch parquet (and the arrow family it pins) to the
# wasm-codec-58.3.0 branch of the arrow-rs fork, pinned by rev. As of rev
# `dc2acae8` the fork's parquet keeps `zstd` in its `default` features but backs it
# per-target: the C `zstd` crate on native, pure-Rust `ruzstd` (decode-only) on
# wasm. So the graph builds for wasm32-unknown-unknown WITH working zstd parquet
# decode (needed to read zstd-compressed data files in the browser); only `brotli`
# stays dropped on wasm. This must stay a patch, not a feature flag:
# datafusion-datasource-parquet and the kernel declare `parquet` without
# `default-features = false`, and Cargo unions features graph-wide. See delta-rs's
# WASM.md for the full rationale.
[patch.crates-io]
parquet = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "parquet" }
arrow = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow" }
arrow-arith = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-arith" }
arrow-array = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-array" }
arrow-buffer = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-buffer" }
arrow-cast = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-cast" }
arrow-data = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-data" }
arrow-ipc = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-ipc" }
arrow-json = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-json" }
arrow-ord = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-ord" }
arrow-row = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-row" }
arrow-schema = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-schema" }
arrow-select = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-select" }
arrow-string = { git = "https://github.com/roeap/arrow-rs", rev = "dc2acae85be7543f4a417b131554ef5c948e992b", package = "arrow-string" }

# object_store: the roeap fork's 0.13.2-based wasm integration branch (per-target
# reqwest split + wasm-guarded retry sleep). Keeps 0.13.2 semver so delta-rs /
# datafusion resolve; enables the real MicrosoftAzure store on wasm32 (browser
# Fetch transport) so query-wasm can drive canonical `olai-uc-object-store`.
object_store = { git = "https://github.com/roeap/arrow-rs-object-store", rev = "e4676ee087161681413a059b38aa1687bcf1a3c2" }
