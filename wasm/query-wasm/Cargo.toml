# The in-browser query engine (WASM_QUERY_PREVIEW.md Phase B): mangrove-specific
# glue around `deltalake-wasm` — UC table resolution over the REST API, vended-
# credential storage access, and a wasm-bindgen surface implementing the
# `open_lakehouse.query.v1` runner contract.
#
# This crate is a member of the STANDALONE wasm workspace (`../Cargo.toml`), which
# owns the size-tuned `[profile.release]` and the `[patch.crates-io]` on the arrow
# family + object_store (the roeap forks). That workspace is deliberately separate
# from the repo-root (native) workspace so the fork stack never leaks into the
# native server build — see `../Cargo.toml` and #182.
#
# The async-native (sm_plans-driven) Delta `TableProvider` — the replacement for
# the eager inline-executor scan path — is the sibling member `olai-delta-df`
# (`../olai-delta-df`); this crate consumes it via a `path` dep. The canonical UC
# crates it also uses (`olai-uc-object-store`/`-client`/`-delta-api`) live in the
# NATIVE workspace under `../../crates/`, so those are cross-workspace `path` deps:
# their `workspace = true` deps resolve against the root workspace that owns their
# manifests, and this workspace's arrow/object_store `[patch.crates-io]` unifies
# the store + arrow types across the whole graph.

[package]
name = "olai-uc-query-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/mangrove"
homepage = "https://unitycatalog.io"
description = "In-browser (wasm32-unknown-unknown) Unity Catalog table preview engine: DataFusion + Delta over UC-vended credentials"
# Floor set by the delta-rs wasm-engine dependency tree (see ../Cargo.toml
# for the wasm workspace's matching pin rationale).
rust-version = "1.91"
publish = false

[lib]
name = "query_wasm"
crate-type = ["cdylib", "rlib"]

# The delta-rs wasm engine, pinned by immutable rev to the roeap fork's
# `feat/kernel-snapshot-accessor` branch (rev d2d0cbae): the sm-plans/wasm line
# with `feat/wasm-max-catalog-version` (so `OpenOptions.max_catalog_version` — the
# discovery-version thread — is retained) and its `delta_kernel` bumped to the
# sm-plans-consolidation tip `c7bc4254` (adds the logical scan-file-row terminal +
# `Scan::scan_file_row_schema` accessor and the `FullState::output_schema` accessor
# + FSR terminal projection). Both deps resolve from one git source and
# pin the SAME kernel rev the `olai-delta-df` sibling pins directly, so exactly
# one `delta_kernel` is in the graph and `SnapshotRef` unifies across it.
#
# NOTE (follow-up): async-native construction no longer uses the facade's
# `Snapshot::kernel_snapshot()` accessor or `open_table_with_store`; the
# deltalake-wasm/-core deps remain only for a now-dead `Error::Delta` variant and
# are slated for removal (see the M3 follow-up issue).
[dependencies]
deltalake-wasm = { git = "https://github.com/roeap/delta-rs", rev = "d2d0cbae3219b04338551949ed7eaf4181255170" }
deltalake-core = { git = "https://github.com/roeap/delta-rs", rev = "d2d0cbae3219b04338551949ed7eaf4181255170", default-features = false, features = [
  "datafusion",
] }

# The async-native (sm_plans-driven) Delta TableProvider — the replacement for the
# eager `DeltaScanNext` + InlineExecutor scan path. It is the sibling member of
# this same wasm workspace (`../olai-delta-df`), so this is a plain in-workspace
# `path` dep; the workspace `[patch.crates-io]` applies to it, unifying its
# `delta_kernel` types with what `deltalake-wasm` returns.
olai-delta-df = { path = "../olai-delta-df" }

# The canonical Unity Catalog crates, now wasm-capable (PRs #150/#151): the
# object-store factory drives the real MicrosoftAzure store over object_store's
# browser-Fetch transport, and the client vends credentials + loads Delta table
# metadata. These live in the NATIVE (repo-root) workspace under `../../crates/`,
# so they are cross-workspace `path` deps; their `workspace = true` deps resolve
# against the root workspace that owns their manifests, and this workspace's
# object_store `[patch.crates-io]` unifies the store type across the whole graph.
# Default features off mirrors how the object-store crate itself depends on the client.
unitycatalog-object-store = { package = "olai-uc-object-store", path = "../../crates/object-store", default-features = false }
unitycatalog-client = { package = "olai-uc-client", path = "../../crates/client", default-features = false }
# The Delta v1 wire models (DeltaLoadTableResponse) the loadTable gate reads.
# default-features = false drops the `server` (axum) surface — models only.
unitycatalog-delta-api = { package = "olai-uc-delta-api", path = "../../crates/delta-api", default-features = false }
# The generated `portal.files.v1.FilesService` contract (buffa message types +
# connect-rust trait/dispatcher/client) — shared with the native Files API server
# (crates/files-api). The in-wasm files dispatcher (files/service.rs) implements
# the trait; files/engine.rs uses its message types. Lives in the NATIVE
# workspace, so this is a cross-workspace `path` dep like the UC crates above; the
# generated code is patch-agnostic so the arrow/object_store `[patch.crates-io]`
# never touches it.
unitycatalog-files-proto = { package = "olai-uc-files-proto", path = "../../crates/files-proto" }

arrow-array = { version = "58" }
arrow-ipc = { version = "58" }
arrow-schema = { version = "58" }
# Feature set copied from the delta-rs wasm workspace: default features minus
# `compression` (async-compression pulls C codecs that cannot build for
# wasm32-unknown-unknown).
datafusion = { version = "54.0.0", default-features = false, features = [
  "nested_expressions",
  "crypto_expressions",
  "datetime_expressions",
  "encoding_expressions",
  "regex_expressions",
  "string_expressions",
  "unicode_expressions",
  "parquet",
  "recursive_protection",
  "sql",
] }
object_store = { version = "0.13.2" }

# Common (native + wasm): the `?Send` async resolve trait lives in `catalog.rs`,
# which is native-visible for tests, so `async-trait` cannot stay wasm-only.
async-trait = { version = "0.1" }
# RFC 1123 / RFC 3339 date parsing in the native-testable directory-list parsers
# (`files/lister.rs`) needs chrono natively too, not just in the wasm fetch store.
chrono = { version = "0.4" }
futures = { version = "0.3" }
percent-encoding = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2" }
url = { version = "2.5" }

# The proto runtime backing the `portal.files.v1` message types the wasm-bindgen
# surface serializes through (via the shared `unitycatalog-files-proto` crate).
# `json` gives the serde impls serde_wasm_bindgen needs; the types are pure and
# build for wasm32. Kept as a direct dep because files/service.rs and the bindings
# name buffa/buffa-types types (e.g. `::buffa_types::google::protobuf::Empty`)
# directly, not only through the generated code.
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }

# ConnectRPC runtime for the in-wasm files dispatcher (files/service.rs, which
# implements the generated FilesService trait from `unitycatalog-files-proto`).
# default-features = false drops `server`/`axum`/`streaming`
# (hyper + tokio-net + async-compression, none of which build for
# wasm32-unknown-unknown); the router/dispatcher/codec/handler modules are always
# compiled, and the crate has a cfg(wasm32) path, so the dispatcher runs in the
# browser. Bytes bypass this (native path), so no streaming feature is needed.
connectrpc = { version = "0.7", default-features = false }
# The generated ConnectRPC *client* (FilesServiceClient<T>) names `::http_body::Body`
# in a trait bound; http-body is a pure-traits crate (wasm-safe) already in the
# connectrpc graph. Needed at the crate root even though the wasm module drives
# the server-side dispatcher, because the client type is emitted unconditionally.
http-body = "1"

# Native builds of deltalake-core require a TLS backend feature; the wasm target
# needs none (the browser supplies fetch), so re-add it natively only. Mirrors
# deltalake-wasm's own manifest.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
deltalake-core = { git = "https://github.com/roeap/delta-rs", rev = "d2d0cbae3219b04338551949ed7eaf4181255170", default-features = false, features = [
  "datafusion",
  "rustls",
] }

# wasm glue: the fetch-backed store, the UC REST client, and the wasm-bindgen
# surface only exist on wasm32-unknown-unknown; everything else compiles (and is
# tested) natively.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
bytes = { version = "1" }
console_error_panic_hook = "0.1"
# The in-wasm ConnectRPC dispatcher (files/service.rs) builds a `RequestContext`
# from an `http::HeaderMap`; connectrpc takes `http` types in its API but does not
# re-export the crate. Pure traits + types — wasm-safe, already in the graph via
# connectrpc.
http = "1"
js-sys = "0.3"
# Kept at 0.13 to match the delta-rs wasm harness; wasm backend = browser fetch.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
send_wrapper = { version = "0.6", features = ["futures"] }
serde-wasm-bindgen = "0.6"
# Pinned exactly: the wasm-bindgen CLI's schema must match this version (the
# `just setup-wasm` recipe installs the same pin — bump both together).
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
arrow = { version = "58" }
arrow-cast = { version = "58", features = ["prettyprint"] }

# tokio's multi-threaded runtime does not compile for wasm; the native tests are
# the only ones that need it (and the fixture generator writes parquet natively).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
parquet = { version = "58", features = ["arrow"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
