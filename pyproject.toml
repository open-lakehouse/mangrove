[project]
name = "unitycatalog-py"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datamodel-code-generator>=0.28.5",
  "marimo[recommended]>=0.14.17",
  "maturin>=1.8.3",
  "pydantic>=2.11.1, <3",
  # "unitycatalog-client",
  "requests>=2.32.3",
]

# [tool.uv.sources]
# unitycatalog-client = { workspace = true }

[tool.uv.workspace]
members = ["python/*", "examples/python"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
# The extension-module stubs (`_client/*.pyi`, written from PyO3's introspection by
# `just codegen generate-py-stubs`) and `_enums.py` (trestle) are generated; skip
# linting them so ruff doesn't churn the generated output on every run.
extend-exclude = [
  "python/client/python/unitycatalog_client/_client",
  "python/client/python/unitycatalog_client/_enums.py",
]

[tool.ruff.lint]
extend-select = [
  "UP",  # pyupgrade
  # "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"
