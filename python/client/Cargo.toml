[package]
name = "unitycatalog-client-py"
version = "0.0.1"
# PyO3 extension module — distributed as a wheel via maturin, not to crates.io.
publish = false
edition = "2024"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "unitycatalog_client"
crate-type = ["cdylib"]

[dependencies]
unitycatalog-client = { package = "olai-uc-client", path = "../../crates/client", version = "0.0.8" }
unitycatalog-common = { package = "olai-uc-common", path = "../../crates/common", version = "0.0.8", features = ["python"] }

futures = { workspace = true }
olai-http = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py312", "experimental-inspect"] }
serde_json = { workspace = true }
url = { workspace = true }

tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }

[dev-dependencies]
# `examples/write_stubs.rs`: the type stubs from PyO3's introspection data.
pyo3-introspection = "0.30"
