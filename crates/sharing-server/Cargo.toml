[package]
# Published under the `olai-sharing-*` prefix, like the sibling crates; the
# crate identifier is the expanded `open_sharing_server`.
name = "olai-sharing-server"
version = "0.0.1"
description = "A composable Open Sharing / Delta Sharing server: shares mapped onto assets in pluggable source catalogs (static, Unity Catalog behind a feature), recipient tokens, delegated or local storage access, sealed secrets, and a provider admin API."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
name = "open_sharing_server"

[[bin]]
# `serve` | `migrate` | `healthcheck` | `rotate-keys`.
name = "sharing-server"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
# local dependencies in alphabetical order
open-sharing-api = { package = "olai-sharing-api", path = "../sharing-api", version = "0.0.1" }
open-sharing-common = { package = "olai-sharing-common", path = "../sharing-common", version = "0.0.1" }
# The Unity Catalog source and admin API (feature `unity`).
unitycatalog-client = { package = "olai-uc-client", path = "../client", version = "0.0.5", optional = true }
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.5", optional = true, features = [
  "axum",
  "credential-vending",
] }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
futures = { workspace = true, optional = true }
# Storage primitives, over catalog-independent credential types: minting from
# stored credentials, and building stores / presigning from a vended credential.
olai-credential-vending = { workspace = true }
olai-storage-credentials = { workspace = true, features = ["sharing"] }
olai-vended-store = { workspace = true, features = ["aws", "azure", "gcp", "fs"] }
# Envelope encryption for secrets at rest.
olai-store = { workspace = true, features = ["encryption"] }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
# Recipient tokens are stored as sha256 digests only.
sha2 = "0.10"
sqlx = { workspace = true, optional = true, features = [
  "postgres",
  "chrono",
  "json",
  "runtime-tokio-rustls",
  "migrate",
  "macros",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true }

# The end-to-end tests drive the UC-shaped admin API.
[[test]]
name = "e2e"
required-features = ["unity"]

[features]
default = ["postgres", "unity"]
# The Postgres `ShareStore` (sqlx, with embedded migrations).
postgres = ["dep:sqlx"]
# Unity Catalog integration: the UC REST catalog source and the provider admin
# API in the UC REST shape. Without it the crate depends on no catalog's models.
unity = ["dep:futures", "dep:unitycatalog-client", "dep:unitycatalog-common"]
# The `sharing-server` binary.
bin = ["postgres", "unity", "dep:clap", "dep:tracing-subscriber"]
