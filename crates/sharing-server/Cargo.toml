[package]
# Provisional `olai-uc-*` name, like the sibling crates; the crate identifier is
# `unitycatalog_sharing_server`.
name = "olai-uc-sharing-server"
version = "0.0.1"
description = "A composable Open Sharing / Delta Sharing server: shares mapped onto assets in pluggable source catalogs (Unity Catalog, static), recipient tokens, delegated or local storage access, sealed secrets, and a provider admin API."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
name = "unitycatalog_sharing_server"

[[bin]]
# `serve` | `migrate` | `healthcheck` | `rotate-keys`.
name = "sharing-server"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
# local dependencies in alphabetical order
unitycatalog-client = { package = "olai-uc-client", path = "../client", version = "0.0.5" }
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.5", features = [
  "axum",
  "store",
] }
unitycatalog-credentials = { package = "olai-uc-credentials", path = "../credentials", version = "0.0.1" }
unitycatalog-object-store = { package = "olai-uc-object-store", path = "../object-store", version = "0.0.5" }
unitycatalog-sharing-api = { package = "olai-uc-sharing-api", path = "../sharing-api", version = "0.0.1" }
unitycatalog-sharing-client = { package = "olai-uc-sharing-client", path = "../sharing-client", version = "0.0.1" }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
# Recipient tokens are stored as sha256 digests only.
sha2 = "0.10"
sqlx = { workspace = true, optional = true, features = [
  "postgres",
  "chrono",
  "json",
  "runtime-tokio-rustls",
  "migrate",
  "macros",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true }

[features]
default = ["postgres"]
# The Postgres `ShareStore` (sqlx, with embedded migrations).
postgres = ["dep:sqlx"]
# The `sharing-server` binary.
bin = ["postgres", "dep:clap", "dep:tracing-subscriber"]
