[package]
name = "olai-sharing-client"
version = "0.0.1"
description = "Open Sharing / Delta Sharing protocol client."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true

[lib]
# Stable Rust crate identifier (the expanded `open_sharing_*` name), independent
# of the `olai-sharing-*` package name.
name = "open_sharing_client"

[dependencies]
# local dependencies in alphabetical order
open-sharing-common = { package = "olai-sharing-common", path = "../sharing-common", version = "0.0.1" }

# workspace dependencies in alphabetical order
chrono = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
olai-http = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
