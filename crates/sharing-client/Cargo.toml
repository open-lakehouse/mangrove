[package]
name = "olai-sharing-client"
version = "0.0.1"
description = "Open Sharing / Delta Sharing protocol client."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true

[lib]
# Stable Rust crate identifier (the expanded `open_sharing_*` name), independent
# of the `olai-sharing-*` package name.
name = "open_sharing_client"

[dependencies]
# local dependencies in alphabetical order
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.5" }

# workspace dependencies in alphabetical order
buffa = { workspace = true }
buffa-types = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
chrono = { workspace = true }
delta_kernel = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
olai-http = { workspace = true }
pbjson = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[features]
default = []
server = ["axum", "axum-extra", "unitycatalog-common/axum"]
