[package]
# Published to crates.io under a provisional `olai-uc-*` name while the design
# settles; the in-workspace dependency key + crate identifier stay
# `unitycatalog(_)credentials` via each dependent's `package =` alias, so no
# source changes. See release-plz.toml / CONTRIBUTING.md.
name = "olai-uc-credentials"
version = "0.0.1"
description = "Storage credential vending for Unity Catalog and Open Sharing servers: storage-location parsing, longest-prefix location resolution, and downscoped AWS STS / Azure SAS temporary credentials."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
# Crate-local README (shown on crates.io / docs.rs), overriding the inherited
# workspace-root README which describes the whole project rather than this crate.
readme = "README.md"
rust-version.workspace = true

[lib]
# Keep the Rust crate identifier stable (`unitycatalog_credentials`) independent
# of the provisional `olai-uc-*` package name.
name = "unitycatalog_credentials"

[dependencies]
# workspace dependencies in alphabetical order
async-trait = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
itertools = { workspace = true }
object_store = { workspace = true }
olai-http = { workspace = true, optional = true }
# Decodes the `se=` expiry out of a vended Azure SAS.
percent-encoding = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[features]
default = ["vending"]
# Minting temporary credentials from cloud providers (native only). Without it the
# crate is just the credential model and storage-location parsing, which build on
# every target (including wasm32).
vending = ["dep:async-trait", "dep:chrono", "dep:olai-http", "dep:percent-encoding"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
