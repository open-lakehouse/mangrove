[package]
name = "olai-uc-storage-proxy"
version = "0.0.3"
description = "Same-origin Unity Catalog storage byte-proxy based on governed Volumes."
categories = ["web-programming::http-server"]
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
# Keep the Rust crate identifier stable (`unitycatalog_storage_proxy`)
# independent of the provisional `olai-uc-*` package name, so source `use` paths,
# sibling crates, and this crate's own tests need no churn from the rename.
name = "unitycatalog_storage_proxy"

# The deployable standalone byte-proxy. Gated behind `bin` so a bare
# library build (the default) never pulls the CLI/runtime deps.
[[bin]]
name = "storage-proxy"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
# local dependencies
unitycatalog-object-store = { package = "olai-uc-object-store", path = "../object-store", version = "0.0.4", optional = true }

# workspace dependecies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
object_store = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# CLI/runtime dependencies for the standalone `storage-proxy` binary, all gated
# behind the `bin` feature so the library build is unaffected.
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
], optional = true }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"], optional = true }
# `blocking` for the `healthcheck` probe. Uses the workspace reqwest (rustls TLS,
# no system OpenSSL).
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde_yml = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
mockito = "1.4"
tokio = { version = "1", features = ["full"] }
tower = { workspace = true }
futures = { workspace = true }

# The router test drives the state-agnostic router (composition + streaming HTTP)
# against the in-memory backend.
[[test]]
name = "router"
required-features = ["testing"]

# The backend test exercises scope/verb enforcement and the conditional-write
# relay against the in-memory backend.
[[test]]
name = "backend"
required-features = ["testing"]

# Proves the client arm forwards the request-context identity to the upstream UC
# vend. Needs `bin` for `ForwardedIdentity` (the standalone binary's context type)
# plus the client arm it pulls in.
[[test]]
name = "forwarded_identity"
required-features = ["bin"]

[features]
default = ["server"]
# The server-side surface: the `StorageProxyBackend` port, the streaming handler,
# the axum router, and the `IntoResponse` error mapping. Pulls `axum`.
server = ["dep:axum"]
# The portable client arm: a `StorageProxyBackend` backed by a
# `UnityObjectStoreFactory`, working against any UC server given {baseUrl, token}.
client-arm = ["server", "dep:unitycatalog-object-store"]
# Exposes `InMemoryStorageProxyBackend`, an in-memory `StorageProxyBackend`
testing = ["server"]
# The deployable `storage-proxy` binary: the CLI (`serve` / `healthcheck`), its
# YAML config, the self-contained request-auth layer, and the client arm that
# resolves + vends through an upstream Unity Catalog. Off by default so a plain
# library build stays lean.
bin = [
  "client-arm",
  "dep:tokio",
  "dep:clap",
  "dep:reqwest",
  "dep:serde_yml",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing-subscriber",
]

[package.metadata.docs.rs]
all-features = true
