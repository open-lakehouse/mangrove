[package]
name = "olai-uc-cli"
version = "0.0.3"
description = "Unity Catalog command-line client (the `uc` binary) for a running server."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[[bin]]
name = "uc"
path = "src/main.rs"

[dependencies]
# path dependencies (in alphabetical order)
unitycatalog-client = { package = "olai-uc-client", path = "../client", version = "0.0.13" }
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.11", features = ["axum", "store"] }

# workspace dependencies (in alphabetical order)
# `uc mcp serve --http`: the router the Streamable HTTP service is nested in.
axum = { workspace = true, optional = true }
# render model enum fields (EnumValue<E>) via buffa's Enumeration trait.
buffa = { workspace = true }
chrono = { workspace = true }
olai-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

# crates.io dependencies (in alphabetical order)
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
console = "0.15"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
# `uc mcp serve`: the official Rust MCP SDK, server role over stdio or
# Streamable HTTP. Tool input schemas are written by hand, so no
# schemars-derived tools/macros.
rmcp = { version = "3.9", default-features = false, features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
], optional = true }
tokio = { version = "1", features = ["full"] }
tui-tree-widget = "0.23"

[features]
default = []
# `uc mcp serve`: an MCP server over stdio or Streamable HTTP for agents, with
# the grant form as an A2UI surface in an MCP App (see crates/cli/src/mcp).
mcp = ["dep:axum", "dep:rmcp"]

[dev-dependencies]
# The in-process server the `mcp` tools are tested against, with the read-only
# SCIM directory the principal search reads.
axum = { workspace = true }
# Raw HTTP requests to `uc mcp serve --http` (stateless requests, Host checks).
reqwest = { workspace = true }
rmcp = { version = "3.9", default-features = false, features = [
  "client",
  "server",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
tempfile = "3.1"
unitycatalog-server = { package = "olai-uc-server", path = "../server", version = "0.0.23", default-features = false, features = [
  "embed",
  "scim",
  "sqlite",
] }
