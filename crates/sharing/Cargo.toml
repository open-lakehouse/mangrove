[package]
# Published to crates.io under a provisional `olai-uc-*` name while the design
# settles; the in-workspace dependency key + crate identifier stay
# `unitycatalog(_)sharing` via each dependent's `package =` alias.
name = "olai-uc-sharing"
version = "0.0.1"
description = "Sharing state for a Delta Sharing provider: shares, recipients, their bearer tokens and the grants between them, with activation codes and key rotation."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
# Crate-local README (shown on crates.io / docs.rs), overriding the inherited
# workspace-root README which describes the whole project rather than this crate.
readme = "README.md"
rust-version.workspace = true

[lib]
# Keep the Rust crate identifier stable (`unitycatalog_sharing`) independent of
# the provisional `olai-uc-*` package name.
name = "unitycatalog_sharing"

[dependencies]
# Only the shared error: the port speaks its own catalog-independent records, so
# no resource models.
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.7", default-features = false }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
chrono = { workspace = true }
olai-store = { workspace = true, features = ["encryption"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }

# crates.io dependencies in alphabetical order
base64 = "0.22"
sha2 = "0.10"

# The SQL backends (features `postgres`, `sqlite`)
sqlx = { workspace = true, optional = true, features = ["macros", "migrate"] }

# The conformance suite (feature `testing`)
tokio = { workspace = true, optional = true, features = ["macros"] }

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "memory"
required-features = ["memory", "testing"]

[[test]]
name = "recipients"
required-features = ["memory"]

[[test]]
name = "postgres"
required-features = ["postgres", "testing"]

[[test]]
name = "sqlite"
required-features = ["sqlite", "testing"]

[features]
default = []
# In-process `InMemorySharingStore`, for tests and ephemeral servers.
memory = []
# `PgSharingStore` and its migrations, over a host-provided pool.
postgres = ["dep:sqlx", "sqlx/postgres"]
# `SqliteSharingStore` and its migrations, over a host-provided pool.
sqlite = ["dep:sqlx", "sqlx/sqlite"]
# The backend conformance suite (`testing::round_trips`).
testing = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
