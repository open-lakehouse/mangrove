[package]
name = "olai-uc-object-store"
version = "0.0.3"
description = "object_store implementation backed by Unity Catalog credential vending."
readme = "README.md"
categories = ["filesystem", "object_store", "unity_catalog"]
documentation = "https://docs.rs/olai-uc-object-store"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true

[lib]
# Stable Rust crate identifier, independent of the provisional package name.
name = "unitycatalog_object_store"

[dependencies]
# local dependencies in alphabetical order
unitycatalog-client = { package = "olai-uc-client", path = "../client", version = "0.0.3", default-features = false }
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.3", default-features = false }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
chrono = { workspace = true }
object_store = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Native transport
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
olai-http = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

# Browser transport
[target.'cfg(target_arch = "wasm32")'.dependencies]
olai-http-wasm = { workspace = true }
web-time = { workspace = true }
send_wrapper = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.1"
tokio = { version = "1", features = ["full"] }
