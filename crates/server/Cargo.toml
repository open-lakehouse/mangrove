[package]
name = "olai-uc-server"
version = "0.0.15"
description = "Unity Catalog REST server with pluggable storage backends."
edition.workspace = true
license.workspace = true
repository.workspace = true
# Crate-local README (not the workspace one): `readme.workspace = true` would
# inherit the workspace `readme = "README.md"`, which Cargo resolves relative to
# the WORKSPACE ROOT — so the generic root README shipped as this crate's page.
# Point at the crate's own tailored README instead.
readme = "README.md"
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true

[lib]
# Stable Rust crate identifier, independent of the provisional package name.
name = "unitycatalog_server"

[[bin]]
# The deployable server binary: `serve` | `migrate` | `healthcheck`. Distinct
# from the `uc` client CLI (crates/cli), mirroring headwaters' `headwaters` vs
# `hw` split. Gated behind the `bin` feature so a bare `olai-uc-server` library
# build (and its library consumers) don't pull the CLI/serve/store dependency
# stack.
name = "uc-server"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
unitycatalog-client = { package = "olai-uc-client", path = "../client", version = "0.0.9", features = [
  "handlers",
], optional = true }
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.8", features = [
  "axum",
  "store",
  "metric-view",
  "credential-vending",
] }
# The generated handler traits + axum route fns, the `Error` and the request
# context, with every error source this server raises.
unitycatalog-handlers = { package = "olai-uc-handlers", path = "../handlers", version = "0.0.2", features = [
  "all-resources",
  "object-store",
  "store",
  "cloud",
] }
unitycatalog-delta-api = { package = "olai-uc-delta-api", path = "../delta-api", version = "0.0.8" }
# Credentials and external locations, with location resolution. The in-memory
# store backs handlers built without a durable backend.
unitycatalog-storage-access = { package = "olai-uc-storage-access", path = "../storage-access", version = "0.0.3", features = [
  "memory",
  "vending",
] }
unitycatalog-storage-proxy = { package = "olai-uc-storage-proxy", path = "../storage-proxy", version = "0.0.9", features = [
  "client-arm",
], optional = true }
unitycatalog-object-store = { package = "olai-uc-object-store", path = "../object-store", version = "0.0.9", optional = true }
unitycatalog-files-api = { package = "olai-uc-files-api", path = "../files-api", version = "0.0.8", features = [
  "client-arm",
  "testing",
], optional = true }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
buffa = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
percent-encoding = "2.1"
futures = { workspace = true }
itertools = { workspace = true }
object_store = { workspace = true }
olai-credential-vending = { workspace = true }
olai-http = { workspace = true }
# `wire::unity` backs the Delta adapter's UC REST credential conversions.
olai-storage-credentials = { workspace = true, features = ["unity"] }
# Stores for the storage byte-proxy local arm (feature `storage-proxy`).
olai-vended-store = { workspace = true, features = ["aws", "azure", "gcp", "fs"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
# Constant-time comparison of bearer tokens.
subtle = "2.6"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { workspace = true }

axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
futures-util = { version = "0.3.28" }
http = { version = "1.2", optional = true }
olai-store = { workspace = true, features = ["encryption"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { workspace = true, features = ["make"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }

# Resource ids (the handlers mint them, whatever the store).
uuid = { workspace = true, features = ["v4", "v7"] }

# `embed` / `bin` dependencies — all optional so a library build of this crate
# doesn't pull the config / storage-backend / serve stack.
unitycatalog-postgres = { package = "olai-uc-postgres", path = "../postgres", version = "0.0.10", optional = true }
unitycatalog-sqlite = { package = "olai-uc-sqlite", path = "../sqlite", version = "0.0.10", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"], optional = true }
# `healthcheck` subcommand probes /health with a blocking client off the tokio
# runtime. Uses the workspace reqwest (rustls TLS, no system OpenSSL) plus the
# additive `blocking` feature this probe path needs.
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde_yml = { workspace = true, optional = true }
# The startup schema check reads the applied migrations (features `postgres` /
# `sqlite`); the backend crates enable the drivers.
sqlx = { workspace = true, optional = true }
swagger-ui-dist = { version = "5.18.3", optional = true }

# `olai-auth` authentication (feature `olai-auth`): JWT verification against a JWKS
# URL, API keys from Postgres, and the verified `Principal` the policy receives.
olai-auth = { workspace = true, optional = true }

[dev-dependencies]
# Signs the test tokens of the `olai-auth` mode.
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
# `#[sqlx::test]` databases for the `integration-pg` tests.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate"] }
mockito = "1.4"
tempfile = "3.1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["axum", "memory"]

axum = ["dep:axum", "dep:axum-extra", "http", "tower", "unitycatalog-handlers/axum"]

# in-memory handler features
memory = []

# the UC client, whose service clients serve as proxy leaves (wrapped in `handlers::Authorized`)
proxy = ["dep:unitycatalog-client"]
federation = ["proxy"]

# The server assembled from a `Config` without binding a socket: config loading,
# the router with its auth layer, `migrate`, and the startup schema check
# (`embed::start`). Hosts that drive the router themselves (e.g. a Neon Function's
# Node-API addon) build on this plus one backend feature, and opt into the
# surfaces below as needed. A config asking for a surface that isn't compiled in
# is a startup error.
embed = ["axum", "dep:base64", "dep:serde_yml", "dep:tower-http"]

# Storage backends.
postgres = ["embed", "dep:unitycatalog-postgres", "sqlx/postgres"]
sqlite = ["embed", "dep:unitycatalog-sqlite", "sqlx/sqlite"]

# `auth.mode: olai-auth`: verified callers (Neon Auth JWTs over a JWKS URL, and
# `olk_` API keys from the `authz` schema). Users' admin and ban status come from
# `neon_auth."user"`. The identity tables are read through their own Postgres pool,
# whatever the storage backend.
olai-auth = [
  "embed",
  "dep:olai-auth",
  "olai-auth/http",
  "olai-auth/postgres",
  "sqlx/postgres",
  "sqlx/runtime-tokio-rustls",
  "unitycatalog-handlers/olai-auth",
]

# Optional surfaces on top of `embed`.
# Swagger UI for the bundled OpenAPI specs (embeds the swagger-ui assets).
swagger = ["embed", "dep:swagger-ui-dist"]
# The bundled single-page app, served off disk (`ui.serve`).
ui = ["embed", "tower-http/fs"]
# The same-origin storage byte-proxy (`storage_proxy.enabled`).
storage-proxy = [
  "embed",
  "dep:unitycatalog-storage-proxy",
  "unitycatalog-storage-proxy/handlers",
  "dep:olai-vended-store",
]
# The embedded Files API (`files.enabled`).
files = ["embed", "dep:unitycatalog-files-api", "dep:unitycatalog-object-store"]

# The deployable `uc-server` binary (serve | migrate | healthcheck): every
# backend and surface, the hybrid proxy (`proxy`), the CLI parser and the
# healthcheck client.
bin = [
  "embed",
  "olai-auth",
  "postgres",
  "sqlite",
  "swagger",
  "ui",
  "storage-proxy",
  "files",
  "proxy",
  "dep:clap",
  "dep:reqwest",
]

# Gates the Azurite credential-vending integration test
# (`tests/credential_vending_azurite.rs`). Requires a running Azurite blob
# emulator; run with `just integration-azurite`.
integration-azurite = ["memory"]

# Postgres-backed integration tests (`tests/neon_user_status.rs`). Need a live
# database: run with `DATABASE_URL` set; `#[sqlx::test]` provisions one per case.
integration-pg = ["olai-auth"]

# Gates the storage byte-proxy end-to-end integration test
# (`tests/storage_proxy_azurite.rs`): drives the proxy router over HTTP against a
# live Azurite, exercising the local arm (authorize → vend → stream). Needs the
# proxy mount (`bin`) + the in-memory store (`memory`) + a running Azurite.
integration-storage-proxy-azurite = ["memory", "bin"]
