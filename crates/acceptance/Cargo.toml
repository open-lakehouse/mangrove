[package]
name = "unitycatalog-acceptance"
version = "0.0.1"
# Internal test harness — never published to crates.io.
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true
description = "Acceptance testing framework for Unity Catalog"

[dependencies]
# repository dependencies
unitycatalog-client = { package = "olai-uc-client", path = "../client", version = "0.0.9" }
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.8" }
# Drives the managed-table Delta staging flow (createStagingTable -> commit ->
# loadTable) and builds a catalog-managed kernel snapshot for the read-back, so
# the managed_table_lifecycle check exercises the real /delta/v1 write+read path
# rather than a bare create_table.
unitycatalog-delta-api = { package = "olai-uc-delta-api", path = "../delta-api", version = "0.0.8" }
# The in-process server (`server::TestServer`, the `uc-test-server` binary): the
# same service `uc-server serve` builds, over an in-memory SQLite backend.
unitycatalog-server = { package = "olai-uc-server", path = "../server", version = "0.0.15", default-features = false, features = [
  "embed",
  "sqlite",
] }

# workspace dependencies
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# The managed-table read-back: a catalog-managed snapshot scanned with the
# kernel's default engine (arrow + parquet come from its re-exports).
delta_kernel = { workspace = true }
delta_kernel_default_engine = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
olai-http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# crates.io dependencies
tempfile = "3.1"
tokio = { version = "1.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
reqwest = { workspace = true }
rstest = "0.18"

[[bin]]
# An in-process server for engine-interop suites (`tests/engines`): prints one
# JSON line with its address once it is ready, then serves until killed.
name = "uc-test-server"
path = "src/bin/uc-test-server.rs"
