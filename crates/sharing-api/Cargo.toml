[package]
# Open Sharing is its own project, not part of Unity Catalog: published to
# crates.io under the `olai-sharing-*` prefix, while the in-workspace dependency
# key + crate identifier use the expanded `open(_)sharing_api` name via each
# dependent's `package =` alias. See release-plz.toml / CONTRIBUTING.md.
name = "olai-sharing-api"
version = "0.0.1"
description = "Portable Open Sharing / Delta Sharing REST API: pluggable share-catalog, storage-access and table-format ports, the discovery + asset handlers, and a delta_kernel-backed Delta query path."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
# Crate-local README (shown on crates.io / docs.rs), overriding the inherited
# workspace-root README which describes the whole project rather than this crate.
readme = "README.md"
rust-version.workspace = true

[lib]
# Keep the Rust crate identifier (`open_sharing_api`) independent of the
# `olai-sharing-*` package name, so source `use` paths, sibling crates, and this
# crate's own tests/examples need no churn from a later rename.
name = "open_sharing_api"

[dependencies]
# local dependencies in alphabetical order
unitycatalog-common = { package = "olai-uc-common", path = "../common", version = "0.0.5" }
open-sharing-client = { package = "olai-sharing-client", path = "../sharing-client", version = "0.0.1" }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
bytes = { workspace = true }
chrono = { workspace = true }
delta_kernel = { workspace = true }
delta_kernel_default_engine = { workspace = true, optional = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
# Stable file ids in query responses (v5 = name-based).
uuid = { workspace = true, features = ["v5"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { workspace = true }

# The handler + router integration tests drive the in-memory backend, which
# lives behind the `testing` feature.
[[test]]
name = "handler"
required-features = ["testing"]

[[test]]
name = "router"
required-features = ["testing"]

[[test]]
name = "query"
required-features = ["testing"]

[[test]]
name = "mount"
required-features = ["testing"]

[features]
# `axum` gates the generated axum route functions, the hand-written router, and
# the error `IntoResponse`. On by default: this crate exists to serve an axum
# surface. The feature name must be `axum` because the generated server code
# hard-codes `#[cfg(feature = "axum")]`. Downstream consumers that only want the
# port + types (no HTTP surface) can opt out with `default-features = false`.
default = ["axum", "delta"]
axum = ["dep:axum", "dep:axum-extra", "open-sharing-client/server"]
# The kernel-backed Delta table format (`format::delta`).
delta = ["dep:delta_kernel_default_engine", "dep:uuid"]
# Exposes `InMemorySharingBackend`, an in-memory `SharingBackend` implementation
# for exercising the sharing logic (discovery + query + asset serving) without a
# real backend. Downstream servers can enable it to test their own port wiring.
testing = ["axum", "delta"]

# docs.rs builds with default features only; enable all features there so the
# `testing` module is documented.
[package.metadata.docs.rs]
all-features = true
