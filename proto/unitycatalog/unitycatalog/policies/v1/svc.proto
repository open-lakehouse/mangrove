syntax = "proto3";

package unitycatalog.policies.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "unitycatalog/policies/v1/models.proto";

// List policies defined on a securable.
message ListPoliciesRequest {
  // The type of the securable to list policies on.
  //
  // Supported values: CATALOG, SCHEMA, TABLE.
  string on_securable_type = 1 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The fully qualified name of the securable to list policies on.
  string on_securable_fullname = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // When true, also return policies defined on the securable's ancestors
  // (e.g. for a table: its schema and catalog). Each returned PolicyInfo still
  // carries its own on_securable_type / on_securable_fullname, so callers can see
  // where it was defined.
  optional bool include_inherited = 3 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of results per page that should be returned.
  //
  // If unset or 0, the server's default page size is used. Negative values are rejected.
  optional int32 max_results = 4 [
    (buf.validate.field).int32.gte = 0,
    (google.api.field_behavior) = OPTIONAL
  ];

  // Opaque pagination token to go to next page based on previous query.
  optional string page_token = 5 [(google.api.field_behavior) = OPTIONAL];
}

// List policies response.
message ListPoliciesResponse {
  // The policies returned.
  repeated PolicyInfo policies = 1;

  // The next_page_token value to include in the next List request.
  optional string next_page_token = 2;
}

// Create a new policy on a securable.
//
// The body is the policy itself; the new policy applies to the securable and all its
// descendants.
message CreatePolicyRequest {
  // At most one of the enforcement options may be set.
  option (buf.validate.message).cel = {
    id: "policy.options.at_most_one"
    message: "at most one of row_filter, column_mask, deny and grant may be set"
    expression: "[has(this.row_filter), has(this.column_mask), has(this.deny), has(this.grant)].filter(x, x).size() <= 1"
  };

  // The name of the policy. Unique within the securable it is defined on.
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The type of securable the policy is defined on.
  //
  // Supported values: CATALOG, SCHEMA, TABLE.
  string on_securable_type = 2 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The fully qualified name of the securable the policy is defined on.
  string on_securable_fullname = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The kind of enforcement this policy applies.
  PolicyType policy_type = 4 [
    (buf.validate.field).enum = {
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];

  // User-provided free-form text description of the policy.
  optional string comment = 5 [(google.api.field_behavior) = OPTIONAL];

  // The principals the policy applies to. Empty means "all principals".
  repeated string to_principals = 6 [(google.api.field_behavior) = OPTIONAL];

  // The principals explicitly excluded from the policy, even if matched by to_principals.
  repeated string except_principals = 7 [(google.api.field_behavior) = OPTIONAL];

  // The type of securables the policy takes effect on.
  optional string for_securable_type = 8 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (google.api.field_behavior) = OPTIONAL
  ];

  // An opaque condition expression evaluated by the query engine at enforcement time.
  optional string when_condition = 9 [(google.api.field_behavior) = OPTIONAL];

  // The columns referenced by the policy function, and the aliases they are bound to.
  repeated MatchColumn match_columns = 10 [(google.api.field_behavior) = OPTIONAL];

  // The row-filter function to invoke. Set only when policy_type is POLICY_TYPE_ROW_FILTER.
  optional FunctionRef row_filter = 11;

  // The column-mask function to invoke. Set only when policy_type is POLICY_TYPE_COLUMN_MASK.
  optional FunctionRef column_mask = 12;

  // The privileges to deny. Set only when policy_type is POLICY_TYPE_DENY.
  optional PrivilegeOptions deny = 13;

  // The privileges to grant. Set only when policy_type is POLICY_TYPE_GRANT.
  optional PrivilegeOptions grant = 14;
}

// Get a policy defined on a securable.
message GetPolicyRequest {
  // The type of the securable the policy is defined on.
  //
  // Supported values: CATALOG, SCHEMA, TABLE.
  string on_securable_type = 1 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The fully qualified name of the securable the policy is defined on.
  string on_securable_fullname = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The name of the policy.
  string name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// Update a policy defined on a securable.
//
// The policy is identified by the path; the body carries the fields to update.
message UpdatePolicyRequest {
  // At most one of the enforcement options may be set.
  option (buf.validate.message).cel = {
    id: "policy.options.at_most_one"
    message: "at most one of row_filter, column_mask, deny and grant may be set"
    expression: "[has(this.row_filter), has(this.column_mask), has(this.deny), has(this.grant)].filter(x, x).size() <= 1"
  };

  // The type of securable the policy is defined on.
  //
  // Supported values: CATALOG, SCHEMA, TABLE.
  string on_securable_type = 1 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The fully qualified name of the securable the policy is defined on.
  string on_securable_fullname = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The name of the policy to update.
  string name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The kind of enforcement this policy applies.
  optional PolicyType policy_type = 4 [(google.api.field_behavior) = OPTIONAL];

  // User-provided free-form text description of the policy.
  optional string comment = 5 [(google.api.field_behavior) = OPTIONAL];

  // The principals the policy applies to. Empty means "all principals".
  repeated string to_principals = 6 [(google.api.field_behavior) = OPTIONAL];

  // The principals explicitly excluded from the policy, even if matched by to_principals.
  repeated string except_principals = 7 [(google.api.field_behavior) = OPTIONAL];

  // The type of securables the policy takes effect on.
  optional string for_securable_type = 8 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (google.api.field_behavior) = OPTIONAL
  ];

  // An opaque condition expression evaluated by the query engine at enforcement time.
  optional string when_condition = 9 [(google.api.field_behavior) = OPTIONAL];

  // The columns referenced by the policy function, and the aliases they are bound to.
  repeated MatchColumn match_columns = 10 [(google.api.field_behavior) = OPTIONAL];

  // The row-filter function to invoke. Set only when policy_type is POLICY_TYPE_ROW_FILTER.
  optional FunctionRef row_filter = 11;

  // The column-mask function to invoke. Set only when policy_type is POLICY_TYPE_COLUMN_MASK.
  optional FunctionRef column_mask = 12;

  // The privileges to deny. Set only when policy_type is POLICY_TYPE_DENY.
  optional PrivilegeOptions deny = 13;

  // The privileges to grant. Set only when policy_type is POLICY_TYPE_GRANT.
  optional PrivilegeOptions grant = 14;

  // The fields to update, as a comma-separated list of field names.
  //
  // If empty or "*", every field set in the request is updated. Otherwise only the
  // listed fields are updated, and a listed field that is unset in the request is cleared.
  optional string update_mask = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Delete a policy defined on a securable.
message DeletePolicyRequest {
  // The type of the securable the policy is defined on.
  //
  // Supported values: CATALOG, SCHEMA, TABLE.
  string on_securable_type = 1 [
    (buf.validate.field).string.pattern = "^(CATALOG|SCHEMA|TABLE)$",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The fully qualified name of the securable the policy is defined on.
  string on_securable_fullname = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // The name of the policy to delete.
  string name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// Manage ABAC row-filter and column-mask policies bound to Unity Catalog securables.
service PoliciesService {
  // List policies
  //
  // Gets an array of policies defined on the specified securable. There is no guarantee
  // of a specific ordering of the elements in the array.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {
    option (google.api.http) = {get: "/policies/{on_securable_type}/{on_securable_fullname}"};
    option (gnostic.openapi.v3.operation) = {operation_id: "ListPolicies"};
  }

  // Create a new policy
  //
  // Creates a new row-filter or column-mask policy on the specified securable.
  rpc CreatePolicy(CreatePolicyRequest) returns (PolicyInfo) {
    option (google.api.http) = {
      post: "/policies"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {operation_id: "CreatePolicy"};
  }

  // Get a policy
  //
  // Gets the policy that matches the supplied name, defined on the specified securable.
  rpc GetPolicy(GetPolicyRequest) returns (PolicyInfo) {
    option (google.api.http) = {get: "/policies/{on_securable_type}/{on_securable_fullname}/{name}"};
    option (gnostic.openapi.v3.operation) = {operation_id: "GetPolicy"};
  }

  // Update a policy
  //
  // Updates the policy that matches the supplied name, defined on the specified securable.
  rpc UpdatePolicy(UpdatePolicyRequest) returns (PolicyInfo) {
    option (google.api.http) = {
      patch: "/policies/{on_securable_type}/{on_securable_fullname}/{name}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {operation_id: "UpdatePolicy"};
  }

  // Delete a policy
  //
  // Deletes the policy that matches the supplied name, defined on the specified securable.
  rpc DeletePolicy(DeletePolicyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/policies/{on_securable_type}/{on_securable_fullname}/{name}"};
    option (gnostic.openapi.v3.operation) = {operation_id: "DeletePolicy"};
  }
}
