syntax = "proto3";

package unitycatalog.schemas.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";

// A schema is a namespace within a catalog that contains tables.
message Schema {
  option (google.api.resource) = {
    type: "unitycatalog.io/Schema"
    pattern: "schemas/{schema}"
    plural: "schemas"
    singular: "schema"
    name_field: "full_name"
  };

  // Name of schema, relative to parent catalog.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Name of parent catalog.
  string catalog_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Full name of schema, in form of catalog_name.schema_name.
  string full_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // User-provided free-form text description.
  optional string comment = 4 [(google.api.field_behavior) = OPTIONAL];

  // A map of key-value properties attached to the securable.
  map<string, string> properties = 5;

  // Username of current owner of schema.
  optional string owner = 6 [(google.api.field_behavior) = OPTIONAL];

  // Time at which this schema was created, in epoch milliseconds.
  optional int64 created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Username of schema creator.
  optional string created_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time at which this schema was last updated, in epoch milliseconds.
  optional int64 updated_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Username of user who last modified schema.
  optional string updated_by = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Unique identifier for the schema.
  optional string schema_id = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // Storage root URL for managed storage location of the schema.
  //
  // Can be set when creating a schema. When set, managed tables/volumes created
  // in this schema are rooted here; otherwise the parent catalog's storage
  // location is used. Example: `s3://bucket/ucroot`.
  optional string storage_root = 12 [(google.api.field_behavior) = OPTIONAL];

  // Storage location URL (full path) for managed storage of the schema.
  //
  // A unique path under `storage_root`. Absent when the schema has no
  // `storage_root`, in which case managed securables fall back to the parent
  // catalog's storage location.
  // Example: `s3://bucket/ucroot/__unitystorage/schemas/{schema_id}`.
  optional string storage_location = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Indicates whether the principal is limited to retrieving metadata
  // for the associated object through the BROWSE privilege when include_browse
  // is enabled in the request.
  optional bool browse_only = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}
