version: v2
modules:
  - path: proto/unitycatalog
    name: buf.build/unitycatalog/unitycatalog
  - path: proto/query
    name: buf.build/unitycatalog/query
  - path: proto/portal
    name: buf.build/unitycatalog/portal
  # trestle's codegen-time annotations (`olai.trestle.v1`), vendored from
  # ../trestle/crates/olai-codegen/proto. A module of its own so `buf generate
  # proto/unitycatalog` doesn't emit models for them.
  - path: proto/trestle
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/gnostic/gnostic
  - buf.build/googleapis/googleapis
  - buf.build/protocolbuffers/wellknowntypes:v29.3
lint:
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
  disallow_comment_ignores: true
breaking:
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
