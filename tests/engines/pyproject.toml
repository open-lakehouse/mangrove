[project]
name = "mangrove-engine-interop"
version = "0.0.0"
description = "Real query engines (DuckDB, later Spark) against mangrove's Delta v1 API."
requires-python = ">=3.12"
dependencies = [
  # Pinned so the extension versions it installs stay comparable across runs.
  "duckdb==2.0.0",
  "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
